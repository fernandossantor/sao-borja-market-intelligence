name: tce-siapc-empenhos-per-organ-parallel-2019-2025

on:
  push:
    branches:
      - explore/receita-estadual-rs-market-intel-v1
    paths:
      - ".github/workflows/tce-siapc-empenhos-per-organ-parallel-2019-2025.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-year:
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        year: [2019, 2020, 2021, 2022, 2023, 2024, 2025]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: explore/receita-estadual-rs-market-intel-v1

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full unzip

      - name: Prepare streaming parser
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .data/tmp/siapc artifacts/tce_siapc_per_organ_parallel
          cat > .data/tmp/siapc/filter_year.py <<'PY'
          import csv
          import json
          import re
          import sys
          import unicodedata
          from collections import Counter, defaultdict
          from decimal import Decimal, InvalidOperation
          from pathlib import Path

          year = int(sys.argv[1])
          outdir = Path(sys.argv[2])
          outdir.mkdir(parents=True, exist_ok=True)

          def norm(v):
              s = unicodedata.normalize('NFKD', str(v))
              s = ''.join(ch for ch in s if not unicodedata.combining(ch)).upper()
              return re.sub(r'[^A-Z0-9]+', '_', s).strip('_')

          def pick(header, aliases):
              lookup = {norm(c): i for i, c in enumerate(header)}
              hits = [(k, lookup[k]) for k in aliases if k in lookup]
              return hits[0][1] if len(hits) == 1 else None

          def dec(v):
              s = str(v or '').strip().replace('R$', '').replace(' ', '')
              if not s:
                  return None
              if ',' in s:
                  s = s.replace('.', '').replace(',', '.')
              try:
                  return Decimal(s)
              except InvalidOperation:
                  return None

          def digits(v):
              return re.sub(r'\D', '', str(v or ''))

          def cpf_ok(raw):
              s = digits(raw).zfill(11)
              if len(s) != 11 or len(set(s)) == 1:
                  return None
              n = [int(x) for x in s]
              d1 = (sum(n[i] * (10-i) for i in range(9)) * 10) % 11
              d1 = 0 if d1 == 10 else d1
              d2 = (sum(n[i] * (11-i) for i in range(10)) * 10) % 11
              d2 = 0 if d2 == 10 else d2
              return s if n[9] == d1 and n[10] == d2 else None

          def cnpj_ok(raw):
              s = digits(raw).zfill(14)
              if len(s) != 14 or len(set(s)) == 1:
                  return None
              n = [int(x) for x in s]
              w1 = [5,4,3,2,9,8,7,6,5,4,3,2]
              w2 = [6,5,4,3,2,9,8,7,6,5,4,3,2]
              r = sum(n[i]*w1[i] for i in range(12)) % 11
              d1 = 0 if r < 2 else 11-r
              r = sum(n[i]*w2[i] for i in range(13)) % 11
              d2 = 0 if r < 2 else 11-r
              return s if n[12] == d1 and n[13] == d2 else None

          raw = sys.stdin.buffer
          first_bytes = raw.readline()
          if not first_bytes:
              raise SystemExit('EMPTY_CSV')
          try:
              first = first_bytes.decode('utf-8-sig')
              encoding = 'utf-8-sig'
              next_encoding = 'utf-8'
          except UnicodeDecodeError:
              first = first_bytes.decode('latin1', errors='replace')
              encoding = 'latin1'
              next_encoding = 'latin1'
          delimiter = ',' if first.count(',') >= first.count(';') else ';'

          def lines():
              yield first
              for b in raw:
                  yield b.decode(next_encoding, errors='replace')

          reader = csv.reader(lines(), delimiter=delimiter, quotechar='"')
          header = next(reader)
          op_i = pick(header, {'TP_OPERACAO','TIPO_OPERACAO','TP_OP'})
          pay_i = pick(header, {'VL_PAGAMENTO','VALOR_PAGAMENTO','VL_PAGO','VALOR_PAGO'})
          emp_i = pick(header, {'VL_EMPENHO','VALOR_EMPENHO','VL_EMPENHADO','VALOR_EMPENHADO'})
          liq_i = pick(header, {'VL_LIQUIDACAO','VALOR_LIQUIDACAO','VL_LIQUIDADO','VALOR_LIQUIDADO'})
          doc_i = pick(header, {'CNPJ_CPF','CGC_CPF_CREDOR','CPF_CNPJ_CREDOR','CNPJ_CPF_CREDOR','NR_CPF_CNPJ_CREDOR'})
          org_i = pick(header, {'CD_ORGAO','COD_ORGAO','CODIGO_ORGAO'})
          org_name_i = pick(header, {'NOME_ORGAO','NM_ORGAO'})

          required = {'operation':op_i, 'payment':pay_i, 'document':doc_i}
          if any(v is None for v in required.values()):
              (outdir/f'schema_{year}.json').write_text(json.dumps({
                  'year':year,'status':'SCHEMA_UNMAPPED','header':header,
                  'mapped':{'operation':op_i,'payment':pay_i,'empenho':emp_i,'liquidacao':liq_i,'document':doc_i,'org':org_i,'org_name':org_name_i},
                  'encoding':encoding,'delimiter':delimiter
              }, ensure_ascii=False, indent=2), encoding='utf-8')
              raise SystemExit(f'SCHEMA_UNMAPPED {required}')

          rows = 0
          op_counts = Counter()
          org_values = Counter()
          event_sum = {'empenho':Decimal('0'),'liquidacao':Decimal('0'),'pagamento':Decimal('0')}
          event_rows = Counter()
          class_rows = Counter()
          class_payment = defaultdict(lambda: Decimal('0'))
          cnpj_payment = defaultdict(lambda: Decimal('0'))
          cnpj_rows = Counter()
          cpf_distinct = set()

          max_i = max(i for i in [op_i,pay_i,emp_i,liq_i,doc_i,org_i,org_name_i] if i is not None)
          for row in reader:
              rows += 1
              if len(row) <= max_i:
                  continue
              op = norm(row[op_i])
              op_counts[op] += 1
              if org_i is not None:
                  org_values[str(row[org_i]).strip()] += 1

              if 'EMPENH' in op and emp_i is not None:
                  v = dec(row[emp_i])
                  if v is not None:
                      event_sum['empenho'] += v; event_rows['empenho'] += 1
              if 'LIQUID' in op and liq_i is not None:
                  v = dec(row[liq_i])
                  if v is not None:
                      event_sum['liquidacao'] += v; event_rows['liquidacao'] += 1
              if 'PAGAM' not in op and op not in {'P','PAGO'}:
                  continue
              p = dec(row[pay_i])
              if p is None:
                  continue
              event_sum['pagamento'] += p; event_rows['pagamento'] += 1
              if p == 0:
                  continue

              rawdoc = digits(row[doc_i])
              cnpj = cnpj_ok(rawdoc)
              cpf = cpf_ok(rawdoc)
              if cnpj and not cpf:
                  cls = 'CNPJ_VALIDO'
                  cnpj_payment[cnpj] += p
                  cnpj_rows[cnpj] += 1
              elif cpf and not cnpj:
                  cls = 'CPF_VALIDO'
                  cpf_distinct.add(cpf)
              elif cnpj and cpf:
                  cls = 'DOCUMENTO_AMBIGUO'
              elif rawdoc:
                  cls = 'DOCUMENTO_INVALIDO_OU_SINTETICO'
              else:
                  cls = 'DOCUMENTO_AUSENTE'
              class_rows[cls] += 1
              class_payment[cls] += p

          schema = {
              'year':year,'status':'READ_OK','rows':rows,'header':header,
              'mapped':{'operation':op_i,'payment':pay_i,'empenho':emp_i,'liquidacao':liq_i,'document':doc_i,'org':org_i,'org_name':org_name_i},
              'operation_values':dict(op_counts),'organ_codes':dict(org_values),
              'encoding':encoding,'delimiter':delimiter
          }
          (outdir/f'schema_{year}.json').write_text(json.dumps(schema, ensure_ascii=False, indent=2), encoding='utf-8')
          summary = {
              'year':year,'status':'READ_OK','rows':rows,
              'empenho_event_sum':str(event_sum['empenho']),
              'liquidacao_event_sum':str(event_sum['liquidacao']),
              'pagamento_event_sum':str(event_sum['pagamento']),
              'empenho_event_rows':event_rows['empenho'],
              'liquidacao_event_rows':event_rows['liquidacao'],
              'pagamento_event_rows':event_rows['pagamento'],
              'payment_doc_class_rows':dict(class_rows),
              'payment_doc_class_value':{k:str(v) for k,v in class_payment.items()},
              'distinct_valid_cnpj':len(cnpj_payment),
              'distinct_valid_cpf':len(cpf_distinct)
          }
          (outdir/f'summary_{year}.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          with (outdir/f'cnpj_payments_{year}.csv').open('w', newline='', encoding='utf-8') as f:
              w=csv.writer(f); w.writerow(['year','cnpj','payment_total','payment_rows'])
              for cnpj in sorted(cnpj_payment):
                  w.writerow([year,cnpj,str(cnpj_payment[cnpj]),cnpj_rows[cnpj]])
          print(json.dumps(summary, ensure_ascii=False))
          PY

      - name: Download official per-organ file and parse
        shell: bash
        env:
          YEAR: ${{ matrix.year }}
        run: |
          set -euo pipefail
          OUT="artifacts/tce_siapc_per_organ_parallel"
          TMP=".data/tmp/siapc"
          printf 'year\torgan_code\tscheme\tformat\turl\tbytes\tsha256\tstatus\n' > "$OUT/source_${YEAR}.tsv"
          ok=0
          for scheme in https http; do
            for ext in csv.7z csv.zip; do
              url="$scheme://dados.tce.rs.gov.br/dados/municipal/empenhos/$YEAR/58000.$ext"
              file="$TMP/58000_${YEAR}.$ext"
              rm -f "$file"
              echo "Trying $url"
              if curl --fail --location --retry 6 --retry-all-errors --retry-delay 8 --connect-timeout 30 --max-time 3600 --output "$file" "$url"; then
                bytes="$(stat -c%s "$file")"
                sha="$(sha256sum "$file" | awk '{print $1}')"
                if [[ "$ext" == "csv.7z" ]]; then
                  if 7z t "$file" >/dev/null; then
                    7z x -so "$file" | python "$TMP/filter_year.py" "$YEAR" "$OUT"
                    ok=1
                  fi
                else
                  if unzip -tq "$file"; then
                    unzip -p "$file" | python "$TMP/filter_year.py" "$YEAR" "$OUT"
                    ok=1
                  fi
                fi
                if [[ "$ok" == "1" ]]; then
                  printf '%s\t58000\t%s\t%s\t%s\t%s\t%s\tOK\n' "$YEAR" "$scheme" "$ext" "$url" "$bytes" "$sha" >> "$OUT/source_${YEAR}.tsv"
                  rm -f "$file"
                  break 2
                fi
              fi
              rm -f "$file"
            done
          done
          if [[ "$ok" != "1" ]]; then
            printf '%s\t58000\t\t\t\t0\t\tFAILED\n' "$YEAR" >> "$OUT/source_${YEAR}.tsv"
            exit 1
          fi

      - name: Upload year artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tce-siapc-per-organ-${{ matrix.year }}
          retention-days: 30
          if-no-files-found: warn
          path: artifacts/tce_siapc_per_organ_parallel/

  consolidate:
    needs: extract-year
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: explore/receita-estadual-rs-market-intel-v1

      - uses: actions/download-artifact@v4
        with:
          pattern: tce-siapc-per-organ-*
          merge-multiple: true
          path: artifacts/tce_siapc_per_organ_parallel

      - name: Consolidate and validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json
          from decimal import Decimal
          from pathlib import Path

          SRC=Path('artifacts/tce_siapc_per_organ_parallel')
          DEST=Path('docs/data_sources/tce_siapc_empenhos_sao_borja_2019_2025_v3')
          DEST.mkdir(parents=True, exist_ok=True)
          SICONFI={
            2019:Decimal('191651936.23'), 2020:Decimal('204996862.35'),
            2021:Decimal('226187346.98'), 2022:Decimal('280509051.03'),
            2023:Decimal('313794938.68'), 2024:Decimal('350893671.81'),
            2025:Decimal('367749323.89')}

          yearly=[]; schemas=[]; cnpj_rows=[]; sources=[]; missing=[]
          for year in range(2019,2026):
              sp=SRC/f'summary_{year}.json'; sc=SRC/f'schema_{year}.json'; cp=SRC/f'cnpj_payments_{year}.csv'; so=SRC/f'source_{year}.tsv'
              if not (sp.exists() and sc.exists() and cp.exists() and so.exists()):
                  missing.append(year); continue
              s=json.loads(sp.read_text(encoding='utf-8'))
              sch=json.loads(sc.read_text(encoding='utf-8'))
              pay=Decimal(s['pagamento_event_sum']); ref=SICONFI[year]
              yearly.append({
                'year':year,'status':s['status'],'rows':s['rows'],
                'empenho_event_sum':s['empenho_event_sum'],
                'liquidacao_event_sum':s['liquidacao_event_sum'],
                'pagamento_event_sum':s['pagamento_event_sum'],
                'distinct_valid_cnpj':s['distinct_valid_cnpj'],
                'distinct_valid_cpf':s['distinct_valid_cpf'],
                'siconfi_dca_paid_total':str(ref),
                'siapc_minus_siconfi':str(pay-ref),
                'siapc_to_siconfi_ratio':str(pay/ref if ref else ''),
                'payment_doc_class_rows':json.dumps(s['payment_doc_class_rows'], ensure_ascii=False),
                'payment_doc_class_value':json.dumps(s['payment_doc_class_value'], ensure_ascii=False)
              })
              schemas.append({
                'year':year,'status':sch['status'],'rows':sch['rows'],
                'encoding':sch['encoding'],'delimiter':sch['delimiter'],
                'mapped':json.dumps(sch['mapped'],ensure_ascii=False),
                'operation_values':json.dumps(sch['operation_values'],ensure_ascii=False),
                'organ_codes':json.dumps(sch['organ_codes'],ensure_ascii=False),
                'header':' | '.join(sch['header'])})
              with cp.open(encoding='utf-8') as f:
                  cnpj_rows.extend(list(csv.DictReader(f)))
              with so.open(encoding='utf-8') as f:
                  sources.extend(list(csv.DictReader(f, delimiter='\t')))

          if missing:
              raise SystemExit(f'MISSING_YEARS={missing}')
          if any(r.get('status')!='OK' for r in sources):
              raise SystemExit(f'FAILED_SOURCE={sources}')

          def write_csv(path, rows, fields):
              with path.open('w', newline='', encoding='utf-8-sig') as f:
                  w=csv.DictWriter(f, fieldnames=fields); w.writeheader(); w.writerows(rows)

          write_csv(DEST/'yearly_payment_aggregate.csv', yearly, list(yearly[0].keys()))
          write_csv(DEST/'schema_inventory.csv', schemas, list(schemas[0].keys()))
          write_csv(DEST/'cnpj_payments_2019_2025.csv', cnpj_rows, ['year','cnpj','payment_total','payment_rows'])
          write_csv(DEST/'source_manifest.csv', sources, ['year','organ_code','scheme','format','url','bytes','sha256','status'])
          (DEST/'privacy_control.json').write_text(json.dumps({
            'row_level_creditor_data_persisted':False,
            'cpf_values_persisted':False,
            'creditor_names_persisted':False,
            'cnpj_aggregates_persisted':True,
            'document_classification':'CPF/CNPJ only after check-digit validation; invalid/synthetic/missing remain aggregate only.'
          },ensure_ascii=False,indent=2),encoding='utf-8')
          validation={
            'years_expected':7,'years_complete':len(yearly),
            'all_source_downloads_ok':all(r.get('status')=='OK' for r in sources),
            'all_schemas_read_ok':all(r['status']=='READ_OK' for r in schemas),
            'organ_code_expected':'58000',
            'siconfi_comparison_is_equality_test':False
          }
          (DEST/'validation_summary.json').write_text(json.dumps(validation,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'validation':validation,'yearly':yearly},ensure_ascii=False,indent=2))
          PY

      - name: Write methodology README
        shell: bash
        run: |
          set -euo pipefail
          DEST="docs/data_sources/tce_siapc_empenhos_sao_borja_2019_2025_v3"
          cat > "$DEST/README.md" <<'EOF'
          # TCE-RS/SIAPC — pagamentos por credor — São Borja — 2019–2025 — v3

          **Fonte:** Tribunal de Contas do Estado do Rio Grande do Sul — Dados Abertos SIAPC — “Despesa orçamentária por empenhos”.
          **Órgão:** PM DE SÃO BORJA, código TCE-RS 58000.
          **Período:** 2019–2025.
          **Unidade monetária:** R$ correntes/nominais do exercício.
          **Rota:** arquivos oficiais por ano e órgão `/dados/municipal/empenhos/<ano>/58000.csv.7z` ou fallback ZIP, com fallback de esquema HTTPS/HTTP.

          A fonte contém empenhos do exercício selecionado, liquidações e pagamentos, inclusive liquidações/pagamentos relacionados a empenhos de exercícios anteriores. O TCE-RS informa que os dados são oriundos do SIAPC e não foram analisados pelo Tribunal, sendo de responsabilidade das entidades remetentes.

          ## Regra de agregação

          As somas são feitas por **tipo de operação**: valor de empenho apenas em linhas de EMPENHO, valor de liquidação apenas em linhas de LIQUIDAÇÃO e valor de pagamento apenas em linhas de PAGAMENTO. Essa regra evita somar um campo repetido em operações de natureza distinta.

          CPF/CNPJ são classificados somente quando os dígitos verificadores validam, após restauração de zeros à esquerda. O Git não persiste nomes, CPFs nem linhas de pessoa física. Para CNPJ válido, persiste apenas agregado anual por documento empresarial.

          ## Comparação com SICONFI

          O total anual de pagamentos do SIAPC é comparado ao DCA/SICONFI como **controle conceitual**, não como teste de igualdade. O SIAPC pode conter pagamentos de empenhos de exercícios anteriores e possui sua própria lógica operacional/administrativa. Diferenças precisam ser explicadas antes de fusão ou substituição de séries.

          ## Interpretação

          Credor não equivale automaticamente a fornecedor mercantil; pagamento a CNPJ não equivale automaticamente a compra/contratação. Geografia cadastral de CNPJ não mede retenção final da renda.
          EOF

      - name: Commit compact evidence
        shell: bash
        run: |
          set -euo pipefail
          DEST="docs/data_sources/tce_siapc_empenhos_sao_borja_2019_2025_v3"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m "data: close SIAPC creditor history 2019 2025"
            git pull --rebase origin explore/receita-estadual-rs-market-intel-v1
            git push origin HEAD:explore/receita-estadual-rs-market-intel-v1
          fi

      - name: Upload consolidated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tce-siapc-sao-borja-2019-2025-v3
          retention-days: 30
          if-no-files-found: warn
          path: docs/data_sources/tce_siapc_empenhos_sao_borja_2019_2025_v3/
