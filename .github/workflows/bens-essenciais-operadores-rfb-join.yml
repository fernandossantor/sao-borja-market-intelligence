name: bens-essenciais-operadores-rfb-join

on:
  pull_request:
    paths:
      - '.github/workflows/bens-essenciais-operadores-rfb-join.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  join:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      COMPETENCE: '2026-08'
      RFB_WEBDAV_BASE: 'https://arquivos.receitafederal.gov.br/public.php/webdav'
      RFB_CNPJ_PATH: 'Dados/Cadastros/CNPJ'
      RFB_SHARE_TOKEN: 'gn672Ad4CF8N6TK'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Prepare target CNPJs and scanner
        shell: bash
        run: |
          set -euo pipefail
