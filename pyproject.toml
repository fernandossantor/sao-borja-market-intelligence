[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sao-borja-market-intelligence"
version = "0.1.0"
description = "Pipeline reprodutível de inteligência econômica e mercadológica de São Borja/RS"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb>=1.4,<2",
  "google-auth>=2.0,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.3,<3",
  "pandera[pandas]>=0.26,<1",
  "pyarrow>=20,<21",
  "pyyaml>=6,<7",
  "requests>=2.32,<3",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
sbmi = "sbmi.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["sbmi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/sbmi/inbox_anomaly_review.py" = ["E501"]
"src/sbmi/inbox_anomaly_review_cli.py" = ["E501"]
"tests/test_inbox_anomaly_review.py" = ["E501"]
"src/sbmi/derived_products_audit.py" = ["E501"]
"src/sbmi/derived_products_audit_cli.py" = ["E501"]
"tests/test_derived_products_audit.py" = ["E501"]
