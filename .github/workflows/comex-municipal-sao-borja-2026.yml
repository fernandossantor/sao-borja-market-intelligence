name: comex-municipal-sao-borja-2026

on:
  push:
    branches:
      - explore/receita-estadual-rs-market-intel-v1
    paths:
      - ".github/workflows/comex-municipal-sao-borja-2026.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: explore/receita-estadual-rs-market-intel-v1

      - name: Install dependencies
        run: python -m pip install --quiet pandas requests

      - name: Query official Comex Stat API for São Borja
        run: |
          cat > /tmp/comex_sb.py <<'PY'
          import csv, hashlib, json, time
          from pathlib import Path
          import requests

          OUT=Path("artifacts/comex_municipal_sao_borja_2026")
          OUT.mkdir(parents=True,exist_ok=True)
          API="https://api-comexstat.mdic.gov.br"
          CITY="4318002"
          PERIOD={"from":"2026-01","to":"2026-08"}
          DETAILS=["country","heading"]
          METRICS=["metricFOB","metricKG"]

          session=requests.Session()
          session.headers.update({
              "User-Agent":"SBMI exploratory audit/2026-09-18",
              "Accept":"application/json",
              "Content-Type":"application/json",
          })

          def request_json(method,url,**kwargs):
              errors=[]
              for verify in (True,False):
                  for attempt in range(1,6):
                      try:
                          r=session.request(method,url,timeout=(30,240),verify=verify,**kwargs)
                          if r.status_code==429:
                              wait=10*attempt
                              errors.append({"status":429,"attempt":attempt,"wait":wait,"text":r.text[:500]})
                              time.sleep(wait)
                              continue
                          r.raise_for_status()
                          return r.json(),{
                              "url":url,
                              "status":r.status_code,
                              "verify_ssl":verify,
                              "bytes":len(r.content),
                              "sha256":hashlib.sha256(r.content).hexdigest(),
                          }
                      except Exception as exc:
                          errors.append({"verify_ssl":verify,"attempt":attempt,"error":repr(exc)})
                          time.sleep(min(5*attempt,20))
              raise RuntimeError(json.dumps({"url":url,"errors":errors},ensure_ascii=False))

          # Authoritative city identity check.
          city_resp,city_http=request_json("GET",f"{API}/tables/cities/{CITY}")
          (OUT/"city_identity.json").write_text(json.dumps({"http":city_http,"response":city_resp},ensure_ascii=False,indent=2),encoding="utf-8")

          # Metadata exposed by the same official API.
          meta={}
          for key,endpoint in {
              "updated":"/general/dates/updated",
              "city_filters":"/cities/filters?language=pt",
              "city_details":"/cities/details?language=pt",
              "city_metrics":"/cities/metrics?language=pt",
          }.items():
              try:
                  resp,http=request_json("GET",API+endpoint)
                  meta[key]={"http":http,"response":resp}
              except Exception as exc:
                  meta[key]={"error":repr(exc)}
          (OUT/"api_metadata.json").write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding="utf-8")

          def unwrap_rows(payload):
              data=payload.get("data") if isinstance(payload,dict) else None
              if isinstance(data,dict) and isinstance(data.get("list"),list):
                  return data["list"]
              if isinstance(data,list):
                  if len(data)==1 and isinstance(data[0],list):
                      return data[0]
                  return data
              return []

          all_rows=[]
          query_log=[]
          for flow in ("export","import"):
              body={
                  "flow":flow,
                  "monthDetail":True,
                  "period":PERIOD,
                  "filters":[{"filter":"city","values":[CITY]}],
                  "details":DETAILS,
                  "metrics":METRICS,
              }
              resp,http=request_json("POST",f"{API}/cities?language=pt",json=body)
              (OUT/f"{flow}_response.json").write_text(json.dumps({"http":http,"body":body,"response":resp},ensure_ascii=False,indent=2),encoding="utf-8")
              if not resp.get("success",False):
                  raise RuntimeError(f"ComexStat API returned success=false for {flow}: {resp}")
              rows=unwrap_rows(resp)
              query_log.append({"flow":flow,"body":body,"http":http,"rows":len(rows)})
              for row in rows:
                  if not isinstance(row,dict): continue
                  all_rows.append({"flow":flow,**row})

          if not all_rows:
              raise SystemExit("ComexStat city API returned zero rows for both flows; cannot close route.")

          # Preserve the official response schema instead of silently renaming unknown fields.
          fieldnames=["flow"]+sorted({k for r in all_rows for k in r.keys() if k!="flow"})
          with (OUT/"comex_2026_sao_borja_sh4_pais_mes.csv").open("w",newline="",encoding="utf-8-sig") as f:
              w=csv.DictWriter(f,fieldnames=fieldnames)
              w.writeheader()
              for r in all_rows:
                  w.writerow({k:r.get(k) for k in fieldnames})

          # Identify canonical response columns by documented/API-observed names.
          def first_key(candidates):
              for k in candidates:
                  if k in fieldnames: return k
              return None

          year_key=first_key(["year","yearNumber","CO_ANO"])
          month_key=first_key(["monthNumber","month","CO_MES"])
          hs4_code=first_key(["headingCode","heading","SH4","codeHeading"])
          hs4_text=first_key(["heading","headingText","headingName","NO_SH4_POR"])
          country_code=first_key(["countryCode","country","CO_PAIS"])
          country_text=first_key(["country","countryText","countryName","NO_PAIS"])
          fob_key=first_key(["metricFOB","VL_FOB"])
          kg_key=first_key(["metricKG","KG_LIQUIDO"])

          required={"year":year_key,"month":month_key,"hs4":hs4_code,"country":country_code,"fob":fob_key,"kg":kg_key}
          missing=[k for k,v in required.items() if v is None]
          if missing:
              raise SystemExit(f"Unexpected ComexStat /cities response schema; missing logical fields {missing}; fields={fieldnames}")

          def num(v):
              if v in (None,""): return 0.0
              return float(str(v).replace(".","").replace(",", ".")) if isinstance(v,str) and "," in v else float(v)

          # Aggregation is deliberately done only after preserving the original rows.
          agg={}
          annual={}
          totals={}
          for r in all_rows:
              key=(r["flow"],str(r.get(year_key)),str(r.get(month_key)),str(r.get(hs4_code)),str(r.get(country_code)))
              a=agg.setdefault(key,{"flow":r["flow"],"year":r.get(year_key),"month":r.get(month_key),"SH4":r.get(hs4_code),"countryCode":r.get(country_code),"metricFOB":0.0,"metricKG":0.0})
              if hs4_text: a["SH4_text"]=r.get(hs4_text)
              if country_text: a["country_text"]=r.get(country_text)
              a["metricFOB"]+=num(r.get(fob_key))
              a["metricKG"]+=num(r.get(kg_key))

              ykey=(r["flow"],str(r.get(year_key)),str(r.get(hs4_code)),str(r.get(country_code)))
              y=annual.setdefault(ykey,{"flow":r["flow"],"year":r.get(year_key),"SH4":r.get(hs4_code),"countryCode":r.get(country_code),"metricFOB":0.0,"metricKG":0.0})
              if hs4_text: y["SH4_text"]=r.get(hs4_text)
              if country_text: y["country_text"]=r.get(country_text)
              y["metricFOB"]+=num(r.get(fob_key))
              y["metricKG"]+=num(r.get(kg_key))

              t=totals.setdefault(r["flow"],{"flow":r["flow"],"metricFOB":0.0,"metricKG":0.0})
              t["metricFOB"]+=num(r.get(fob_key))
              t["metricKG"]+=num(r.get(kg_key))

          def write_dicts(path,rows):
              rows=list(rows)
              fields=[]
              for row in rows:
                  for k in row:
                      if k not in fields: fields.append(k)
              with path.open("w",newline="",encoding="utf-8-sig") as f:
                  w=csv.DictWriter(f,fieldnames=fields)
                  w.writeheader(); w.writerows(rows)

          monthly_rows=sorted(agg.values(),key=lambda r:(r["flow"],str(r["year"]),int(r["month"]),-r["metricFOB"]))
          annual_rows=sorted(annual.values(),key=lambda r:(r["flow"],-r["metricFOB"]))
          write_dicts(OUT/"comex_2026_sao_borja_sh4_pais_mes_aggregated.csv",monthly_rows)
          write_dicts(OUT/"comex_2026_sao_borja_sh4_pais_ytd.csv",annual_rows)
          write_dicts(OUT/"comex_2026_sao_borja_totals_ytd.csv",totals.values())

          rice=[r for r in annual_rows if str(r.get("SH4","")).zfill(4)=="1006"]
          write_dicts(OUT/"comex_2026_sao_borja_rice_sh4_1006_seed.csv",rice)

          summary={
              "source":"MDIC/SECEX — API oficial Comex Stat — endpoint /cities",
              "api_base":API,
              "period":"2026-01 a 2026-08",
              "municipality":"São Borja/RS",
              "municipality_filter":{"filter":"city","value":CITY},
              "details":DETAILS,
              "metrics":METRICS,
              "monthDetail":True,
              "fiscal_domicile_limitation":"O módulo municipal identifica o domicílio fiscal da empresa declarante; não a origem física da mercadoria.",
              "city_identity":city_resp,
              "query_log":query_log,
              "response_fields":fieldnames,
              "logical_field_mapping":required,
              "raw_rows":len(all_rows),
              "totals":list(totals.values()),
              "rice_seed_rows":len(rice),
              "nature":"DADO OBSERVADO na resposta oficial; agregações mensais/YTD são DADOS CALCULADOS.",
              "canonical_promotion":False,
          }
          (OUT/"run_summary.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
          python /tmp/comex_sb.py

      - name: Persist filtered exploratory evidence only
        run: |
          mkdir -p docs/data_sources/comex_municipal_sao_borja_2026
          cp artifacts/comex_municipal_sao_borja_2026/*.csv docs/data_sources/comex_municipal_sao_borja_2026/
          cp artifacts/comex_municipal_sao_borja_2026/*_response.json docs/data_sources/comex_municipal_sao_borja_2026/
          cp artifacts/comex_municipal_sao_borja_2026/city_identity.json docs/data_sources/comex_municipal_sao_borja_2026/
          cp artifacts/comex_municipal_sao_borja_2026/api_metadata.json docs/data_sources/comex_municipal_sao_borja_2026/
          cp artifacts/comex_municipal_sao_borja_2026/*.json docs/data_sources/comex_municipal_sao_borja_2026/
          cat > docs/data_sources/comex_municipal_sao_borja_2026/README.md <<'EOF'
          # Comex Stat municipal — São Borja — 2026

          Camada exploratória, não canônica.

          Fonte primária: MDIC/SECEX, API oficial do Comex Stat, endpoint /cities.

          Recorte: São Borja/RS; janeiro-agosto/2026; filtro municipal pelo código IBGE 4318002; detalhamento por país e SH4.

          Controle conceitual obrigatório: CO_MUN e SG_UF_MUN representam o domicílio
          fiscal da empresa declarante. Não representam a origem física da mercadoria.

          Saídas preservam direção (EXP/IMP), ano, mês, SH4, país, quilograma líquido
          e US$ FOB. O SH4 1006 (arroz) é mantido apenas como primeiro teste técnico;
          a arquitetura é multissetorial.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data_sources/comex_municipal_sao_borja_2026
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "data: extract Comex municipal 2026 for São Borja"
            git fetch origin explore/receita-estadual-rs-market-intel-v1
            git rebase origin/explore/receita-estadual-rs-market-intel-v1
            git push origin HEAD:explore/receita-estadual-rs-market-intel-v1
          fi

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comex-municipal-sao-borja-2026
          retention-days: 30
          if-no-files-found: warn
          path: artifacts/comex_municipal_sao_borja_2026/
