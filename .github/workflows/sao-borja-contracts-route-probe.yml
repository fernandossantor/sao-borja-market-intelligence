name: sao-borja-contracts-route-probe

on:
  push:
    branches:
      - explore/receita-estadual-rs-market-intel-v1
    paths:
      - ".github/workflows/sao-borja-contracts-route-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: explore/receita-estadual-rs-market-intel-v1

      - name: Probe PMSB contracts route
        shell: bash
        run: |
          set -euo pipefail
          OUT="artifacts/sao_borja_contracts_route_probe"
          mkdir -p "$OUT"
          python - <<'PY'
          import json,re,requests
          from html import unescape
          from pathlib import Path
          from urllib.parse import urljoin

          BASE="https://transparencia.saoborja.rs.gov.br"
          OUT=Path("artifacts/sao_borja_contracts_route_probe")
          s=requests.Session()
          s.headers.update({"User-Agent":"Mozilla/5.0 SBMI exploratory contracts probe/1.0"})

          report={"base":BASE,"tested":[],"institutions":[],"exercises":[],"months":[],"scripts":[],"route_candidates":[],"errors":[]}

          def get(url, **kw):
              try:
                  r=s.get(url,timeout=60,**kw)
                  report["tested"].append({"method":"GET","url":r.url,"status":r.status_code,"bytes":len(r.content)})
                  return r
              except Exception as e:
                  report["errors"].append({"method":"GET","url":url,"error":repr(e)})
                  return None

          r=get(BASE+"/acordos")
          if r is None:
              raise SystemExit("unable to fetch /acordos")
          raw=r.content
          # portal pages can advertise/contain a charset that requests mis-detects; try common encodings
          text=None
          for enc in [r.encoding,"utf-8","iso-8859-1","windows-1252"]:
              if not enc: continue
              try:
                  text=raw.decode(enc)
                  break
              except Exception:
                  pass
          if text is None:
              text=raw.decode("utf-8","replace")

          (OUT/"acordos_page.html").write_text(text,encoding="utf-8")

          # Inspect all select/option blocks. Keep labels only as diagnostics.
          selects={}
          for sm in re.finditer(r'<select[^>]*(?:name|id)=["\']([^"\']+)["\'][^>]*>(.*?)</select>',text,re.I|re.S):
              name=sm.group(1)
              opts=[]
              for om in re.finditer(r'<option[^>]*value=["\']?([^"\' >]*)["\']?[^>]*>(.*?)</option>',sm.group(2),re.I|re.S):
                  label=re.sub(r'<[^>]+>',' ',om.group(2))
                  label=re.sub(r'\s+',' ',unescape(label)).strip()
                  opts.append({"value":unescape(om.group(1)).strip(),"label":label})
              selects[name]=opts
          report["selects"]=selects

          # Normalize likely dimensions.
          for name,opts in selects.items():
              low=name.lower()
              if "instit" in low:
                  report["institutions"]=opts
              elif "exerc" in low or "ano" in low:
                  report["exercises"]=opts
              elif "mes" in low:
                  report["months"]=opts

          # Inspect linked JS for route strings.
          scripts=[]
          for m in re.finditer(r'<script[^>]+src=["\']([^"\']+)["\']',text,re.I):
              u=urljoin(BASE+"/acordos",unescape(m.group(1)))
              if u not in scripts: scripts.append(u)
          report["scripts"]=scripts
          for u in scripts:
              rr=get(u)
              if rr is None or rr.status_code>=400: continue
              try: js=rr.content.decode(rr.encoding or "utf-8","replace")
              except Exception: js=rr.text
              if u.endswith("/js/acordos/index.js"):
                  report["acordos_index_js"]=js
              for pat in [r'["\']([^"\']*acordos[^"\']*)["\']',r'["\']([^"\']*(?:pesquisar|getAcord|getContrato|contrat)[^"\']*)["\']']:
                  for mm in re.finditer(pat,js,re.I):
                      cand=mm.group(1)
                      if cand not in report["route_candidates"]:
                          report["route_candidates"].append(cand)

          inst=[x for x in report["institutions"] if x.get("value")]
          report["selected_institution"]=inst[0] if inst else None

          if inst:
              iid=inst[0]["value"]

              # Exact exercise route observed in the PMSB JavaScript.
              try:
                  rr=s.get(BASE+"/acordos/buscarExercicios/"+iid,timeout=60)
                  payload=rr.json() if rr.ok else {}
                  years=sorted([str(k) for k in payload.keys() if str(k).isdigit()])
                  report["exercise_endpoint"]={"url":rr.url,"status":rr.status_code,"payload":payload,"years":years}
              except Exception as e:
                  years=[]
                  report["errors"].append({"method":"GET","url":BASE+"/acordos/buscarExercicios/"+iid,"error":repr(e)})

              # The HTML form uses FiltroInstituicao/FiltroExercicio/FiltroMes.
              # Probe both GET and POST and extract rows that mention the Foundation.
              report["year_probes"]=[]
              target_years=[str(y) for y in range(2019,2026)]
              for exval in target_years:
                  params={"FiltroInstituicao":iid,"FiltroExercicio":exval,"FiltroMes":""}
                  for method in ("GET","POST"):
                      try:
                          if method=="GET":
                              rr=s.get(BASE+"/acordos/pesquisar",params=params,timeout=60)
                          else:
                              rr=s.post(BASE+"/acordos/pesquisar",data=params,timeout=60)
                          body=rr.content.decode(rr.encoding or "utf-8","replace")
                          plain=re.sub(r'<[^>]+>',' ',body)
                          plain=re.sub(r'\\s+',' ',unescape(plain)).strip()
                          hig=[m.group(0) for m in re.finditer(r'.{0,250}IVAN GOULART.{0,500}',plain,re.I)]
                          probe={"year":exval,"method":method,"url":rr.url,"status":rr.status_code,
                                 "bytes":len(rr.content),"hig_hits":hig[:30],
                                 "contains_hig":bool(hig)}
                          if exval=="2025" and method=="GET":
                              # Capture form and script structure of the result page to locate async data route.
                              fm=re.search(r"<form[^>]*id=['\"]FiltroIndexForm['\"][^>]*>.*?</form>",body,re.I|re.S)
                              probe["form_snippet"]=(fm.group(0)[:8000] if fm else None)
                              rscripts=[]
                              for sm in re.finditer(r"<script[^>]+src=['\"]([^'\"]+)['\"]",body,re.I):
                                  su=urljoin(BASE+"/acordos/pesquisar",unescape(sm.group(1)))
                                  if su not in rscripts: rscripts.append(su)
                              probe["scripts"]=rscripts
                              probe["inline_route_candidates"]=list(dict.fromkeys(
                                  mm.group(1) for mm in re.finditer(r"['\"]([^'\"]*(?:acordos|contrat|pesquisar|get[A-Z])[^'\"]*)['\"]",body,re.I)
                              ))[:100]
                              report["result_page_scripts"]=[]
                              for su in rscripts:
                                  sr=get(su)
                                  if sr is None or sr.status_code>=400: continue
                                  sj=sr.content.decode(sr.encoding or "utf-8","replace")
                                  cand=list(dict.fromkeys(
                                      mm.group(1) for mm in re.finditer(r"['\"]([^'\"]*(?:acordos|contrat|pesquisar|get[A-Z])[^'\"]*)['\"]",sj,re.I)
                                  ))
                                  if cand:
                                      report["result_page_scripts"].append({"url":su,"candidates":cand[:100],"text":sj if len(sj)<12000 else sj[:12000]})
                          report["year_probes"].append(probe)
                          if method=="POST":
                              (OUT/("acordos_"+exval+".html")).write_text(body,encoding="utf-8")
                      except Exception as e:
                          report["errors"].append({"method":method,"url":BASE+"/acordos/pesquisar","year":exval,"error":repr(e)})

          (OUT/"diagnostics.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Persist diagnostics
        if: always()
        shell: bash
        run: |
          DEST="docs/data_sources/sao_borja_contracts_route_probe"
          mkdir -p "$DEST"
          if [ -f artifacts/sao_borja_contracts_route_probe/diagnostics.json ]; then
            cp artifacts/sao_borja_contracts_route_probe/diagnostics.json "$DEST/diagnostics.json"
            cat > "$DEST/README.md" <<'EOF'
          # PMSB — diagnóstico da rota de contratos

          Probe exploratório da página oficial `https://transparencia.saoborja.rs.gov.br/acordos`.

          Objetivo: identificar valores de instituição/exercício e rotas dinâmicas para futura extração
          censitária de contratos. O probe não promove valores de contratos e não substitui execução
          financeira.

          A descoberta desta rota deve ser tratada separadamente da série de processos de Licitações
          e da série de pagamentos.
          EOF
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$DEST"
            if ! git diff --cached --quiet; then
              git commit -m "data: persist PMSB contracts route diagnostics"
              git pull --rebase origin explore/receita-estadual-rs-market-intel-v1
              git push origin HEAD:explore/receita-estadual-rs-market-intel-v1
            fi
          fi

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sao-borja-contracts-route-probe
          retention-days: 30
          if-no-files-found: warn
          path: artifacts/sao_borja_contracts_route_probe/
