name: novo-bolsa-familia-browser-audit

on:
  pull_request:
    paths:
      - ".github/workflows/novo-bolsa-familia-browser-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve official download link with browser DOM
        run: |
          set -euo pipefail
          python -m pip install --upgrade playwright
          python -m playwright install chromium
          mkdir -p artifacts
          python - <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          URL = "https://portaldatransparencia.gov.br/download-de-dados/novo-bolsa-familia"
          report = {
              "page": URL,
              "objective": "resolve the official open-data link generated by the Portal for Novo Bolsa Familia 2026-07 without downloading beneficiary-level data",
              "target_year": "2026",
              "target_month": "07",
              "pii_downloaded": False,
          }

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(accept_downloads=False)
              response = page.goto(URL, wait_until="domcontentloaded", timeout=90000)
              report["navigation_status"] = response.status if response else None
              page.wait_for_timeout(6000)

              report["title"] = page.title()
              report["year_options_initial"] = page.locator("#links-anos option").all_text_contents()
              report["year_values_initial"] = page.locator("#links-anos option").evaluate_all("els => els.map(e => e.value)")

              if page.locator("#links-anos").count():
                  try:
                      page.select_option("#links-anos", "2026")
                  except Exception:
                      # fallback by visible label
                      page.select_option("#links-anos", label="2026")
                  page.wait_for_timeout(800)

              report["month_options_2026"] = page.locator("#links-meses option").all_text_contents()
              report["month_values_2026"] = page.locator("#links-meses option").evaluate_all("els => els.map(e => e.value)")

              if page.locator("#links-meses").count():
                  selected = False
                  for candidate in ["07", "7", "JULHO", "Julho", "julho"]:
                      try:
                          page.select_option("#links-meses", candidate)
                          selected = True
                          break
                      except Exception:
                          pass
                  if not selected:
                      opts = page.locator("#links-meses option").evaluate_all("els => els.map(e => ({value:e.value,text:e.textContent}))")
                      july = next((o for o in opts if "jul" in (o["text"] or "").lower() or o["value"] in ["07","7"]), None)
                      if july:
                          page.select_option("#links-meses", july["value"])
                  page.wait_for_timeout(1200)

              anchors = page.locator("a[href]").evaluate_all("els => els.map(e => ({text:(e.textContent||'').trim(), href:e.href, id:e.id, cls:e.className}))")
              report["candidate_download_anchors"] = [
                  a for a in anchors
                  if "download-de-dados/novo-bolsa-familia" in a["href"] or "NovoBolsaFamilia" in a["href"] or "novo-bolsa" in a["href"].lower()
              ]
              report["all_visible_downloadish"] = [
                  a for a in anchors if "baix" in a["text"].lower() or "download" in a["href"].lower()
              ][:100]
              Path("artifacts/novo_bolsa_familia_browser_audit_v001.json").write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")
              print(json.dumps(report, ensure_ascii=False, indent=2))
              browser.close()
          PY
      - name: Upload browser audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novo-bolsa-familia-browser-audit-v001
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
