name: dfe-corede-sector-series-v1

on:
  push:
    branches: [feature/cnpj-territorial-control-v1]
    paths: [".github/workflows/dfe-corede-sector-series-v1.yml"]
  pull_request:
    branches: [main]
    paths: [".github/workflows/dfe-corede-sector-series-v1.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null
      - name: Query Fronteira Oeste NFC-e by year and CNAE division
        run: |
          set -euo pipefail
          mkdir -p artifacts/dfe_corede_sector_series
          cat > /tmp/q.py <<'PY'
          import asyncio,csv,json,uuid
          from pathlib import Path
          from playwright.async_api import async_playwright

          OUT=Path("artifacts/dfe_corede_sector_series")
          REPORT="https://app.powerbi.com/view?r=eyJrIjoiOGZlNDQzMzMtOGQ0MS00Y2I4LWE2ZDEtNmQ4YmEwMzZlZDEzIiwidCI6IjgzYmQwOTBiLTc1NmUtNGEwMi1hNTEyLWU1ZWEwMmMwMzA0MSJ9"
          ENTITY="v_PBI_Dfe_Totais_Corede_Setor"

          def col(src,p): return {"Column":{"Expression":{"SourceRef":{"Source":src}},"Property":p},"Name":f"{ENTITY}.{p}"}
          def agg(src,p): return {"Aggregation":{"Expression":{"Column":{"Expression":{"SourceRef":{"Source":src}},"Property":p}},"Function":0},"Name":f"Sum({ENTITY}.{p})"}
          def inf(src,p,v): return {"Condition":{"In":{"Expressions":[{"Column":{"Expression":{"SourceRef":{"Source":src}},"Property":p}}],"Values":[[{"Literal":{"Value":f"'{v}'"}}]]}}}

          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True); ctx=await b.new_context(); page=await ctx.new_page()
              cap={}; ev=asyncio.Event()
              async def onreq(req):
                if cap or "querydata" not in req.url.lower(): return
                try:
                  body=req.post_data_json
                  if isinstance(body,dict) and body.get("queries"):
                    cap["url"]=req.url; cap["headers"]=await req.all_headers(); cap["body"]=body; ev.set()
                except: pass
              page.on("request",onreq)
              await page.goto(REPORT,wait_until="domcontentloaded",timeout=120000)
              await asyncio.wait_for(ev.wait(),90); await page.wait_for_timeout(3000)

              tpl=cap["body"]; appctx=tpl["queries"][0].get("ApplicationContext",{}); src="v"
              semantic={"Version":2,"From":[{"Name":src,"Entity":ENTITY,"Type":0}],
                "Select":[col(src,"Ano"),col(src,"cod_cnae_divisao"),col(src,"nome_cnae_divisao"),agg(src,"vlr_total_dfe"),agg(src,"qtde_dfe")],
                "Where":[inf(src,"corede","FRONTEIRA OESTE"),inf(src,"Modelo","NFC-e")],
                "OrderBy":[
                  {"Direction":1,"Expression":{"Column":{"Expression":{"SourceRef":{"Source":src}},"Property":"Ano"}}},
                  {"Direction":1,"Expression":{"Column":{"Expression":{"SourceRef":{"Source":src}},"Property":"cod_cnae_divisao"}}}
                ]}
              cmd={"SemanticQueryDataShapeCommand":{"Query":semantic,
                "Binding":{"Primary":{"Groupings":[{"Projections":[0,1,2,3,4]}]},"DataReduction":{"DataVolume":6,"Primary":{"Window":{"Count":2000}}},"Version":1},
                "ExecutionMetricsKind":1}}
              commands=[cmd]
              qbody={"version":"1.0.0","queries":[{"Query":{"Commands":commands},"CacheKey":json.dumps({"Commands":commands},separators=(",",":")),"QueryId":"","ApplicationContext":appctx}],"cancelQueries":[],"modelId":tpl["modelId"]}
              headers={k:v for k,v in cap["headers"].items() if k.lower() not in ("content-length","host","cookie","origin","referer","user-agent")}
              headers["content-type"]="application/json"; headers["activityid"]=str(uuid.uuid4()); headers["requestid"]=str(uuid.uuid4())
              resp=await ctx.request.post(cap["url"],headers=headers,data=json.dumps(qbody)); text=await resp.text()
              if resp.status!=200: raise RuntimeError(f"HTTP {resp.status}: {text[:2000]}")
              js=json.loads(text); data=js["results"][0]["result"]["data"]; ds=data["dsr"]["DS"][0]
              dm=(ds.get("PH") or [{}])[0].get("DM0",[]); dicts=ds.get("ValueDicts",{})
              # inspect descriptor to associate dictionary slots with categorical columns.
              desc=data["descriptor"]["Select"]
              # PowerBI allocates dictionaries in appearance order for string categoricals.
              string_cols=[i for i,d in enumerate(desc) if d.get("Kind")==1 and not d.get("Format") and d.get("Value","").startswith("G")]
              dict_keys=sorted(dicts.keys(), key=lambda x:int(x[1:]) if x[1:].isdigit() else 0)
              dict_by_col={c:dicts[k] for c,k in zip(string_cols,dict_keys)}

              prev=[None]*5; rows=[]
              for er in dm:
                it=iter(er.get("C",[])); R=er.get("R",0) or 0; vals=[]
                for i in range(5): vals.append(prev[i] if R&(1<<i) else next(it,None))
                prev=vals
                decoded=[]
                for i,v in enumerate(vals):
                  if i in dict_by_col and v is not None: decoded.append(dict_by_col[i][int(v)])
                  else: decoded.append(v)
                year=int(decoded[0]); code=int(decoded[1]); label=str(decoded[2]); value=float(decoded[3] or 0); qty=int(float(decoded[4] or 0))
                if year in (2023,2024,2025):
                  rows.append({"ano":year,"cod_cnae_divisao":code,"nome_cnae_divisao":label,"vlr_total_dfe":round(value,2),"qtde_dfe":qty})

              totals={}
              for y in (2023,2024,2025):
                yy=[r for r in rows if r["ano"]==y]; tv=sum(r["vlr_total_dfe"] for r in yy); tq=sum(r["qtde_dfe"] for r in yy)
                totals[str(y)]={"valor":round(tv,2),"quantidade":tq}
                for r in yy:
                  r["participacao_valor_pct"]=round(r["vlr_total_dfe"]/tv*100,6) if tv else 0
                  r["participacao_qtde_pct"]=round(r["qtde_dfe"]/tq*100,6) if tq else 0

              cols=["ano","cod_cnae_divisao","nome_cnae_divisao","vlr_total_dfe","qtde_dfe","participacao_valor_pct","participacao_qtde_pct"]
              with (OUT/"fronteira_oeste_nfce_cnae_divisao_2023_2025.csv").open("w",newline="",encoding="utf-8") as f:
                w=csv.DictWriter(f,fieldnames=cols); w.writeheader(); w.writerows(rows)
              selected=[r for r in rows if r["cod_cnae_divisao"] in (47,56)]
              summary={"source":"Receita Estadual RS public PowerBI","corede":"FRONTEIRA OESTE","modelo":"NFC-e","totals":totals,"selected_47_56":selected,
                "warning":"Regional benchmark only; never allocate to São Borja by population, CNPJ, stores, employment or payroll."}
              (OUT/"summary.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding="utf-8")
              print("SBMI_DFE_COREDE_SERIES_BEGIN"); print(json.dumps(summary,ensure_ascii=False,indent=2)); print("SBMI_DFE_COREDE_SERIES_END")
              await b.close()
          asyncio.run(main())
          PY
          python /tmp/q.py
      - uses: actions/upload-artifact@v4
        with:
          name: dfe-corede-sector-series-v1
          path: artifacts/dfe_corede_sector_series/
          if-no-files-found: error
          retention-days: 30
