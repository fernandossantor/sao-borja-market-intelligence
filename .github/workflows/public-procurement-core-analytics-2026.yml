name: public-procurement-core-analytics-2026

on:
  push:
    branches:
      - explore/receita-estadual-rs-market-intel-v1
    paths:
      - ".github/workflows/public-procurement-core-analytics-2026.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: explore/receita-estadual-rs-market-intel-v1

      - name: Build procurement-compatible core analytics
        shell: bash
        run: |
          set -euo pipefail
          OUT="artifacts/public_procurement_core_analytics_2026"
          mkdir -p "$OUT"

          python - <<'PY'
          import csv,json,math
          from collections import defaultdict
          from pathlib import Path

          SRC=Path("docs/data_sources/sao_borja_transparencia_cnpj_rubricas_2026/cnpj_rubrica_summary_2026.csv")
          RULE=Path("docs/data_sources/public_procurement_eligibility_rubric_20260919_v001.csv")
          OUT=Path("artifacts/public_procurement_core_analytics_2026")

          rule={}
          with RULE.open(encoding="utf-8-sig",newline="") as f:
              for r in csv.DictReader(f):
                  rule[r["rubrica"]]=r["classificacao"]

          by_vendor=defaultdict(lambda:{"nome":"","pago":0.0,"rubricas":set(),"empenhos":0})
          by_rubric=defaultdict(lambda:{"pago":0.0,"cnpjs":set(),"empenhos":0})
          classified=defaultdict(float)
          total=0.0
          rows=0
          unmatched=set()

          with SRC.open(encoding="utf-8-sig",newline="") as f:
              for r in csv.DictReader(f):
                  pago=float(r["pago_R$"] or 0)
                  rub=r["rubrica"]
                  cls=rule.get(rub)
                  if cls is None:
                      unmatched.add(rub)
                      continue
                  classified[cls]+=pago
                  total+=pago
                  rows+=1
                  if cls!="CORE_PROCUREMENT" or pago<=0:
                      continue
                  cnpj=r["cnpj"]
                  v=by_vendor[cnpj]
                  v["nome"]=r["nome_credor"]
                  v["pago"]+=pago
                  v["rubricas"].add(rub)
                  v["empenhos"]+=int(float(r["empenhos"] or 0))
                  q=by_rubric[rub]
                  q["pago"]+=pago
                  q["cnpjs"].add(cnpj)
                  q["empenhos"]+=int(float(r["empenhos"] or 0))

          if unmatched:
              raise RuntimeError(f"Unclassified rubrics: {sorted(unmatched)}")

          core=classified["CORE_PROCUREMENT"]
          vendors=sorted(by_vendor.items(),key=lambda kv:kv[1]["pago"],reverse=True)
          if not vendors:
              raise RuntimeError("No core vendors")

          with (OUT/"core_vendor_summary_2026.csv").open("w",newline="",encoding="utf-8-sig") as f:
              fields=["rank","cnpj","nome_credor","pago_core_R$","share_core","rubricas_core","empenhos_core"]
              w=csv.DictWriter(f,fieldnames=fields);w.writeheader()
              for rank,(cnpj,v) in enumerate(vendors,1):
                  w.writerow({
                      "rank":rank,"cnpj":cnpj,"nome_credor":v["nome"],
                      "pago_core_R$":round(v["pago"],2),
                      "share_core":v["pago"]/core if core else None,
                      "rubricas_core":" | ".join(sorted(v["rubricas"])),
                      "empenhos_core":v["empenhos"]
                  })

          with (OUT/"core_rubric_summary_2026.csv").open("w",newline="",encoding="utf-8-sig") as f:
              fields=["rubrica","cnpjs","empenhos","pago_core_R$","share_core"]
              w=csv.DictWriter(f,fieldnames=fields);w.writeheader()
              for rub,v in sorted(by_rubric.items(),key=lambda kv:kv[1]["pago"],reverse=True):
                  w.writerow({
                      "rubrica":rub,"cnpjs":len(v["cnpjs"]),"empenhos":v["empenhos"],
                      "pago_core_R$":round(v["pago"],2),"share_core":v["pago"]/core
                  })

          shares=[v["pago"]/core for _,v in vendors]
          hhi=sum(s*s for s in shares)*10000
          def top(n): return sum(v["pago"] for _,v in vendors[:n])
          report={
              "period":"2026-01-01 to 2026-09-18",
              "source":"Portal da Transparência da Prefeitura de São Borja",
              "classification_nature":"rubric-based procurement-compatible core; not final legal procurement eligibility",
              "all_cnpj_paid_R$":round(total,2),
              "core_paid_R$":round(core,2),
              "ambiguous_paid_R$":round(classified["AMBIGUO"],2),
              "excluded_paid_R$":round(classified["EXCLUIR"],2),
              "core_vendors":len(vendors),
              "core_rubrics":len(by_rubric),
              "concentration":{
                  "top1_R$":round(top(1),2),"top1_share":top(1)/core,
                  "top5_R$":round(top(5),2),"top5_share":top(5)/core,
                  "top10_R$":round(top(10),2),"top10_share":top(10)/core,
                  "top20_R$":round(top(20),2),"top20_share":top(20)/core,
                  "hhi_0_10000":hhi
              },
              "dominant_vendor":{
                  "cnpj":vendors[0][0],"name":vendors[0][1]["nome"],
                  "paid_R$":round(vendors[0][1]["pago"],2),
                  "share_core":vendors[0][1]["pago"]/core
              },
              "limitations":[
                  "CORE_PROCUREMENT is a rubric-compatible analytical universe, not a final legal/procurement classification.",
                  "Other services to legal entities may contain institutional service arrangements or pass-through structures; entity/legal-instrument screening remains necessary.",
                  "Territorial locality is not inferred in this workflow."
              ]
          }
          (OUT/"core_concentration_2026.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Persist compact evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          DEST="docs/data_sources/public_procurement_core_analytics_2026"
          mkdir -p "$DEST"
          cp artifacts/public_procurement_core_analytics_2026/* "$DEST/"
          cat > "$DEST/README.md" <<'EOF'
          # PMSB — núcleo de rubricas compatíveis com compras/contratações — 2026

          Camada exploratória, não canônica.

          O universo parte da reconciliação integral dos pagamentos a CNPJ no Portal
          da Transparência e aplica a classificação de rubricas documentada em
          public_procurement_eligibility_rubric_20260919_v001.csv.

          IMPORTANTE: CORE_PROCUREMENT significa “compatível com aquisição/contratação
          pela natureza da rubrica”. Não equivale automaticamente a procedimento
          licitatório, contrato mercantil puro ou fornecedor privado.

          Serviços de terceiros PJ podem incluir arranjos institucionais relevantes.
          A classificação final requer, quando material, natureza jurídica, instrumento
          e/ou inspeção do objeto. Localidade do fornecedor é etapa separada.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m "data: profile procurement-compatible core concentration"
            git pull --rebase origin explore/receita-estadual-rs-market-intel-v1
            git push origin HEAD:explore/receita-estadual-rs-market-intel-v1
          fi

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-procurement-core-analytics-2026
          retention-days: 30
          if-no-files-found: warn
          path: artifacts/public_procurement_core_analytics_2026/
