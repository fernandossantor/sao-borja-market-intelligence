name: consumer-income-distribution-sidra

on:
  pull_request:
    paths:
      - ".github/workflows/consumer-income-distribution-sidra.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch official SIDRA 10296 distribution for Sao Borja
        run: |
          python -m pip install --upgrade requests
          mkdir -p artifacts/raw_official
          python - <<'PY'
          import csv
          import hashlib
          import json
          from pathlib import Path
          import requests

          base = "https://apisidra.ibge.gov.br/values/t/10296/n6/4318002"
          candidates = [
              base + "/v/all/p/2022/c2/0/c86/0/c386/all/h/y/f/a/d/m",
              base + "/v/allxp/p/2022/c2/0/c86/0/c386/all/h/y/f/a/d/m",
          ]
          s = requests.Session()
          s.headers.update({"User-Agent": "SBMI SIDRA 10296 distribution extraction/1.0"})
          manifest = {
              "source": "IBGE/SIDRA tabela 10296",
              "geography": "São Borja/RS",
              "municipality_ibge": "4318002",
              "period": "2022",
              "classification_filters": {"sexo": "Total", "cor_ou_raca": "Total", "classe_rendimento": "Todas"},
              "nature": "observed_official_sidra_income_distribution_extraction",
              "attempts": [],
          }
          selected_url = None
          payload = None
          raw = None
          for i, url in enumerate(candidates, start=1):
              attempt = {"url": url}
              try:
                  r = s.get(url, timeout=60)
                  attempt["http_status"] = r.status_code
                  attempt["content_type"] = r.headers.get("content-type")
                  attempt["bytes"] = len(r.content)
                  attempt["sha256"] = hashlib.sha256(r.content).hexdigest()
                  Path(f"artifacts/raw_official/sidra_10296_attempt_{i}.json").write_bytes(r.content)
                  r.raise_for_status()
                  data = r.json()
                  attempt["json_rows"] = len(data) if isinstance(data, list) else None
                  if isinstance(data, list) and len(data) > 2:
                      selected_url = url
                      payload = data
                      raw = r.content
                      attempt["status"] = "selected"
                      manifest["attempts"].append(attempt)
                      break
                  attempt["status"] = "insufficient_payload"
              except Exception as exc:
                  attempt["status"] = "error"
                  attempt["error_type"] = type(exc).__name__
                  attempt["error"] = str(exc)
              manifest["attempts"].append(attempt)

          if payload is None:
              Path("artifacts/sidra_10296_manifest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8")
              raise SystemExit("Could not recover SIDRA 10296 distribution")

          header = payload[0]
          rows = payload[1:]
          dim_names = {k: v for k, v in header.items() if k.endswith("N") or k.endswith("C")}
          clean = []
          for row in rows:
              clean.append({
                  "municipio_codigo": row.get("D1C", ""),
                  "municipio": row.get("D1N", ""),
                  "variavel_codigo": row.get("D2C", ""),
                  "variavel": row.get("D2N", ""),
                  "periodo_codigo": row.get("D3C", ""),
                  "periodo": row.get("D3N", ""),
                  "sexo_codigo": row.get("D4C", ""),
                  "sexo": row.get("D4N", ""),
                  "cor_raca_codigo": row.get("D5C", ""),
                  "cor_raca": row.get("D5N", ""),
                  "classe_rendimento_codigo": row.get("D6C", ""),
                  "classe_rendimento": row.get("D6N", ""),
                  "unidade_codigo": row.get("MC", ""),
                  "unidade": row.get("MN", ""),
                  "valor_raw": row.get("V", ""),
                  "natureza": "observado_em_fonte_oficial",
                  "source_url": selected_url,
                  "raw_sha256": hashlib.sha256(raw).hexdigest(),
              })

          out = Path("artifacts/sidra_10296_sao_borja_income_distribution_2022.csv")
          with out.open("w", encoding="utf-8", newline="") as f:
              writer = csv.DictWriter(f, fieldnames=list(clean[0]))
              writer.writeheader()
              writer.writerows(clean)

          manifest["selected_url"] = selected_url
          manifest["selected_sha256"] = hashlib.sha256(raw).hexdigest()
          manifest["header"] = header
          manifest["rows_count"] = len(clean)
          manifest["variables"] = sorted({(r["variavel_codigo"], r["variavel"], r["unidade"]) for r in clean})
          manifest["classes"] = [(r["classe_rendimento_codigo"], r["classe_rendimento"]) for r in clean if r["classe_rendimento"]]
          manifest["status"] = "success"
          Path("artifacts/sidra_10296_manifest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2, default=list), encoding="utf-8")
          print(json.dumps(manifest, ensure_ascii=False, indent=2, default=list))
          print(out.read_text(encoding="utf-8"))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sidra-10296-sao-borja-income-distribution-2022
          if-no-files-found: error
          retention-days: 30
          path: artifacts/
