name: inss-benefits-residence-extract

on:
  pull_request:
    paths:
      - ".github/workflows/inss-benefits-residence-extract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-sao-borja:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download official July 2026 INSS resource and filter Sao Borja residence
        run: |
          set -euo pipefail
          python -m pip install --upgrade requests
          mkdir -p artifacts

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import requests

          rid = "63467992-f291-4549-8a07-b1d5ee27a1a2"
          api = f"https://dadosabertos.inss.gov.br/api/3/action/resource_show?id={rid}"
          s = requests.Session()
          s.headers.update({"User-Agent": "SBMI INSS residence extraction/2.0"})
          meta_response = s.get(api, timeout=45)
          meta_response.raise_for_status()
          resource = meta_response.json()["result"]
          url = resource["url"]
          Path("artifacts/inss_resource_show_raw.json").write_bytes(meta_response.content)

          target = Path("/tmp/inss_emitidos_202607.zip")
          sha = hashlib.sha256()
          total = 0
          with s.get(url, stream=True, timeout=(30, 300)) as r:
              r.raise_for_status()
              response_headers = {
                  "status": r.status_code,
                  "content_type": r.headers.get("content-type"),
                  "content_length": r.headers.get("content-length"),
                  "etag": r.headers.get("etag"),
                  "last_modified": r.headers.get("last-modified"),
                  "accept_ranges": r.headers.get("accept-ranges"),
                  "final_url": r.url,
              }
              with target.open("wb") as f:
                  for chunk in r.iter_content(chunk_size=8 * 1024 * 1024):
                      if not chunk:
                          continue
                      f.write(chunk)
                      sha.update(chunk)
                      total += len(chunk)

          expected = response_headers.get("content_length")
          if expected and total != int(expected):
              raise SystemExit(f"Download size mismatch: {total} != {expected}")

          manifest = {
              "dataset": "Benefícios emitidos - Plano de Dados Abertos Jun/2023 a jun/2027",
              "resource": resource.get("name"),
              "resource_id": rid,
              "reference_period": "2026-07",
              "source_system": "SUIBE/INSS",
              "resource_url": url,
              "resource_created": resource.get("created"),
              "resource_metadata_modified": resource.get("metadata_modified"),
              "download_headers": response_headers,
              "downloaded_bytes": total,
              "download_sha256": sha.hexdigest(),
              "raw_national_file_persisted_in_artifact": False,
              "raw_national_file_note": "Arquivo nacional usado temporariamente no runner; o artifact preserva metadados, hash e recorte São Borja, não o ZIP nacional de ~1 GB.",
          }
          Path("artifacts/inss_202607_download_manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

          python - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          with zipfile.ZipFile("/tmp/inss_emitidos_202607.zip") as z:
              infos = z.infolist()
              if len(infos) != 1:
                  raise SystemExit(f"Expected one ZIP member, found {len(infos)}")
              info = infos[0]
              with z.open(info) as f:
                  header = f.readline()
              layout = {
                  "member": info.filename,
                  "compress_type": info.compress_type,
                  "compressed_size": info.compress_size,
                  "uncompressed_size": info.file_size,
                  "crc": info.CRC,
                  "flag_bits": info.flag_bits,
                  "header_bytes": len(header),
              }
              Path("artifacts/inss_202607_zip_layout.json").write_text(
                  json.dumps(layout, ensure_ascii=False, indent=2), encoding="utf-8"
              )
              Path("artifacts/inss_202607_header_raw.bin").write_bytes(header)
              Path("/tmp/inss_member_name.txt").write_text(info.filename, encoding="utf-8")
              print(json.dumps(layout, ensure_ascii=False, indent=2))
          PY

          MEMBER="$(cat /tmp/inss_member_name.txt)"
          unzip -p /tmp/inss_emitidos_202607.zip "$MEMBER" | LC_ALL=C grep -i 'BORJA' > /tmp/inss_borja_candidates_raw.bin || true
          wc -c /tmp/inss_borja_candidates_raw.bin

          python - <<'PY'
          import csv
          import hashlib
          import io
          import json
          import re
          import unicodedata
          from collections import defaultdict
          from decimal import Decimal, InvalidOperation
          from pathlib import Path

          header_b = Path("artifacts/inss_202607_header_raw.bin").read_bytes()
          candidates_b = Path("/tmp/inss_borja_candidates_raw.bin").read_bytes()

          def decode(data):
              for enc in ("utf-8-sig", "utf-8", "latin-1"):
                  try:
                      return data.decode(enc), enc
                  except UnicodeDecodeError:
                      continue
              raise RuntimeError("No supported encoding")

          candidates_text, encoding = decode(candidates_b)
          header_text = header_b.decode(encoding, errors="strict")

          def norm(value):
              value = unicodedata.normalize("NFKD", str(value))
              value = "".join(c for c in value if not unicodedata.combining(c))
              value = value.upper().strip()
              value = re.sub(r"[^A-Z0-9]+", " ", value)
              return re.sub(r"\s+", " ", value).strip()

          header_line = header_text.strip("\r\n")
          delim = ";" if header_line.count(";") >= header_line.count(",") else ","
          headers = next(csv.reader([header_line], delimiter=delim))
          normalized_headers = [norm(h) for h in headers]

          def exact_col(label):
              target = norm(label)
              matches = [i for i, h in enumerate(normalized_headers) if h == target]
              return matches[0] if matches else None

          residence_idx = exact_col("municipio_residencia")
          value_idx = exact_col("credito")
          type_idx = exact_col("tipo_beneficio")
          client_idx = exact_col("clientela")
          uf_idx = exact_col("uf")
          species_matches = [i for i, h in enumerate(normalized_headers) if h == "ESPECIE"]
          species_idx = species_matches[0] if species_matches else None

          if residence_idx is None or value_idx is None:
              raise SystemExit(f"Required source columns not found. Headers={headers}")

          def parse_decimal(raw):
              s = str(raw).strip().replace("R$", "").replace(" ", "")
              if not s:
                  return None
              if "," in s and "." in s:
                  if s.rfind(",") > s.rfind("."):
                      s = s.replace(".", "").replace(",", ".")
                  else:
                      s = s.replace(",", "")
              elif "," in s:
                  s = s.replace(".", "").replace(",", ".")
              try:
                  return Decimal(s)
              except InvalidOperation:
                  return None

          reader = csv.reader(io.StringIO(candidates_text), delimiter=delim)
          matched = []
          candidate_count = 0
          bad_width = 0
          for row in reader:
              candidate_count += 1
              if len(row) != len(headers):
                  bad_width += 1
                  continue
              residence_literal = row[residence_idx]
              if norm(residence_literal) != "SAO BORJA":
                  continue
              matched.append((row, residence_literal, parse_decimal(row[value_idx])))

          if not matched:
              raise SystemExit("No exact São Borja rows found in municipio_residencia")

          keep_indices = []
          for idx in [residence_idx, uf_idx, type_idx, species_idx, client_idx, value_idx]:
              if idx is not None and idx not in keep_indices:
                  keep_indices.append(idx)

          filtered_path = Path("artifacts/inss_emitidos_sao_borja_residencia_202607_v002.csv")
          with filtered_path.open("w", encoding="utf-8", newline="") as f:
              writer = csv.writer(f)
              writer.writerow([headers[i] for i in keep_indices] + ["periodo_referencia", "natureza"])
              for row, _, _ in matched:
                  writer.writerow([row[i] for i in keep_indices] + ["2026-07", "observado_em_fonte_oficial"])

          type_summary = defaultdict(lambda: {"records": 0, "value": Decimal("0"), "value_valid": 0})
          species_summary = defaultdict(lambda: {"records": 0, "value": Decimal("0"), "value_valid": 0})
          total_value = Decimal("0")
          valid_values = 0
          for row, _, value in matched:
              type_key = row[type_idx] if type_idx is not None else "[não identificado]"
              species_key = row[species_idx] if species_idx is not None else "[não identificado]"
              type_summary[type_key]["records"] += 1
              species_summary[species_key]["records"] += 1
              if value is not None:
                  valid_values += 1
                  total_value += value
                  type_summary[type_key]["value"] += value
                  type_summary[type_key]["value_valid"] += 1
                  species_summary[species_key]["value"] += value
                  species_summary[species_key]["value_valid"] += 1

          def write_summary(path, label, mapping):
              with Path(path).open("w", encoding="utf-8", newline="") as f:
                  writer = csv.writer(f)
                  writer.writerow([label, "registros_emitidos", "registros_credito_valido", "soma_credito_rs", "periodo", "natureza"])
                  for key, stats in sorted(mapping.items(), key=lambda kv: (-kv[1]["value"], kv[0])):
                      writer.writerow([key, stats["records"], stats["value_valid"], f"{stats['value']:.2f}", "2026-07", "calculado_a_partir_de_registros_oficiais"])

          write_summary("artifacts/inss_emitidos_sao_borja_202607_por_tipo_v002.csv", "tipo_beneficio_fonte", type_summary)
          write_summary("artifacts/inss_emitidos_sao_borja_202607_por_especie_v002.csv", "especie_fonte", species_summary)

          validation = {
              "reference_period": "2026-07",
              "source": "INSS Portal de Dados Abertos / SUIBE — Benefícios Emitidos Julho 2026",
              "source_geographic_field": headers[residence_idx],
              "source_value_field_literal": headers[value_idx],
              "source_value_semantics": "O portal descreve o conteúdo do conjunto como incluindo valor líquido; no CSV de 2026-07 o cabeçalho literal da coluna correspondente é credito.",
              "source_type_field": headers[type_idx] if type_idx is not None else None,
              "source_species_field": headers[species_idx] if species_idx is not None else None,
              "source_clientela_field": headers[client_idx] if client_idx is not None else None,
              "source_uf_field_preserved_not_used_for_geographic_filter": headers[uf_idx] if uf_idx is not None else None,
              "source_encoding": encoding,
              "delimiter": delim,
              "source_header_columns": headers,
              "duplicate_source_headers": {"especie": len(species_matches)},
              "candidate_lines_containing_borja": candidate_count,
              "candidate_bad_width": bad_width,
              "matched_exact_municipio_residencia_records": len(matched),
              "valid_credit_records": valid_values,
              "sum_credit_rs": f"{total_value:.2f}",
              "unique_residence_literals": sorted({m[1] for m in matched}),
              "type_categories_literal": sorted(type_summary.keys()),
              "species_categories_count": len(species_summary),
              "filtered_csv_sha256": hashlib.sha256(filtered_path.read_bytes()).hexdigest(),
              "interpretation_limit": "Contagem é de registros de benefícios/créditos emitidos no arquivo mensal filtrado pelo campo municipio_residencia; não relabelar como número de pessoas beneficiárias sem identificador que garanta unicidade.",
              "annualization_limit": "Não multiplicar automaticamente a soma mensal por 12; competências podem conter 13º, ajustes e variações mensais.",
          }
          Path("artifacts/inss_emitidos_sao_borja_202607_validation_v002.json").write_text(
              json.dumps(validation, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(validation, ensure_ascii=False, indent=2))
          PY

          rm -f /tmp/inss_emitidos_202607.zip /tmp/inss_borja_candidates_raw.bin

      - name: Upload Sao Borja INSS extraction artifact
        uses: actions/upload-artifact@v4
        with:
          name: inss-emitidos-sao-borja-residencia-202607-v002
          if-no-files-found: error
          retention-days: 30
          path: artifacts/
