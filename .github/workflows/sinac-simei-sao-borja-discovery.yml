name: sinac-simei-sao-borja-discovery

on:
  push:
    branches:
      - explore/receita-estadual-rs-market-intel-v1
    paths:
      - ".github/workflows/sinac-simei-sao-borja-discovery.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: explore/receita-estadual-rs-market-intel-v1

      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null

      - name: Reproduce official SINAC/SIMEI municipal queries
        run: |
          cat > /tmp/sinac_simei_sb.py <<'PY'
          import asyncio, csv, json, re, unicodedata
          from pathlib import Path
          from playwright.async_api import async_playwright

          OUT = Path("artifacts/sinac_simei_sao_borja")
          OUT.mkdir(parents=True, exist_ok=True)

          PAGES = {
              "sinac_total": ("https://www8.receita.fazenda.gov.br/simplesnacional/aplicacoes/atbhe/estatisticassinac.app/EstatisticasOptantesPorDataMunicipio.aspx?tipoConsulta=1", "total"),
              "simei_total": ("https://www8.receita.fazenda.gov.br/simplesnacional/aplicacoes/atbhe/estatisticassinac.app/EstatisticasOptantesPorDataMunicipio.aspx?optanteSimei=&tipoConsulta=2", "total"),
              "sinac_cnae": ("https://www8.receita.fazenda.gov.br/simplesnacional/aplicacoes/atbhe/estatisticassinac.app/EstatisticasOptantesPorCNAE.aspx?tipoConsulta=1", "cnae"),
              "simei_cnae": ("https://www8.receita.fazenda.gov.br/simplesnacional/aplicacoes/atbhe/estatisticassinac.app/EstatisticasOptantesPorCNAE.aspx?optanteSimei=&tipoConsulta=2", "cnae"),
          }
          SB_INTERNAL = "8863"

          def norm(s):
              s = unicodedata.normalize("NFKD", str(s or ""))
              s = "".join(ch for ch in s if not unicodedata.combining(ch))
              return re.sub(r"\s+", " ", s).strip().upper()

          async def settle(page, ms=1000):
              try:
                  await page.wait_for_load_state("networkidle", timeout=12000)
              except Exception:
                  pass
              await page.wait_for_timeout(ms)

          async def select_and_postback(page, selector, value, log):
              loc=page.locator(selector)
              if not await loc.count():
                  log.append({"action":"select_missing","selector":selector,"value":value})
                  return False
              await loc.select_option(value=value, force=True)
              log.append({"action":"select","selector":selector,"value":value})
              await settle(page,1600)
              return True

          async def snapshot(page, tag):
              sels=[]
              for i in range(await page.locator("select").count()):
                  s=page.locator("select").nth(i)
                  try:
                      sels.append({
                          "index":i,
                          "id":await s.get_attribute("id"),
                          "name":await s.get_attribute("name"),
                          "visible":await s.is_visible(),
                          "value":await s.input_value(),
                          "options":await s.locator("option").evaluate_all("(els)=>els.map(o=>({text:o.textContent,value:o.value,selected:o.selected}))"),
                      })
                  except Exception as exc:
                      sels.append({"index":i,"error":repr(exc)})
              return {
                  "tag":tag,
                  "url":page.url,
                  "title":await page.title(),
                  "selects":sels,
                  "hidden":{
                      "municipios":await page.locator("#ctl00_ctl00_Conteudo_AposTabela_hfMunicipios").input_value() if await page.locator("#ctl00_ctl00_Conteudo_AposTabela_hfMunicipios").count() else None,
                      "uf":await page.locator("#ctl00_ctl00_Conteudo_AposTabela_hfUF").input_value() if await page.locator("#ctl00_ctl00_Conteudo_AposTabela_hfUF").count() else None,
                      "check":await page.locator("#ctl00_ctl00_Conteudo_AposTabela_hfCheck").input_value() if await page.locator("#ctl00_ctl00_Conteudo_AposTabela_hfCheck").count() else None,
                  },
                  "body":(await page.locator("body").inner_text())[:200000],
              }

          async def set_filter(page, log):
              # The site loads a hidden jQuery-UI filter whose source list is populated
              # client-side after the UF changes. Wait for São Borja explicitly.
              uf=page.locator("#ctl00_ctl00_Conteudo_AposTabela_ddlUf")
              if not await uf.count():
                  log.append({"action":"filter_uf_missing"})
                  return False
              await uf.select_option(value="RS", force=True)
              log.append({"action":"filter_uf","value":"RS"})
              try:
                  await page.locator(f'#lbOrigem option[value="{SB_INTERNAL}"]').wait_for(state="attached",timeout=12000)
              except Exception:
                  await page.wait_for_timeout(2500)
              source=page.locator("#lbOrigem")
              found=False
              if await source.count():
                  opts=await source.locator("option").evaluate_all("(els)=>els.map(o=>({text:o.textContent,value:o.value}))")
                  for o in opts:
                      if norm(o.get("text"))=="SAO BORJA":
                          await source.select_option(value=o.get("value"),force=True)
                          log.append({"action":"select_sao_borja","value":o.get("value"),"text":o.get("text")})
                          found=True
                          break
              if not found:
                  log.append({"action":"sao_borja_not_found","available_count":await source.locator("option").count() if await source.count() else 0})
                  return False
              if await page.locator("#btnInserir").count():
                  await page.locator("#btnInserir").click(force=True)
                  log.append({"action":"insert_sao_borja"})
                  await page.wait_for_timeout(500)
              dest=page.locator("#lbDestino")
              destvals=await dest.locator("option").evaluate_all("(els)=>els.map(o=>({text:o.textContent,value:o.value}))") if await dest.count() else []
              log.append({"action":"destination_snapshot","options":destvals})
              # Reproduce the modal's OK semantics directly if the dialog is visible;
              # otherwise set the same hidden fields explicitly from the selected destination.
              ok=page.locator('.ui-dialog:has(#divModalFiltroIrpf) button:has-text("Ok")')
              if await ok.count() and await ok.first.is_visible():
                  await ok.first.click(force=True)
                  log.append({"action":"filter_ok"})
                  await page.wait_for_timeout(700)
              else:
                  vals=[x.get("value") for x in destvals if x.get("value")]
                  await page.evaluate("""({vals})=>{
                    const m=document.querySelector('#ctl00_ctl00_Conteudo_AposTabela_hfMunicipios');
                    const u=document.querySelector('#ctl00_ctl00_Conteudo_AposTabela_hfUF');
                    const c=document.querySelector('#ctl00_ctl00_Conteudo_AposTabela_hfCheck');
                    if(m) m.value=vals.join(',');
                    if(u) u.value='RS';
                    if(c) c.value='false';
                  }""",{"vals":vals})
                  log.append({"action":"hidden_filter_set","municipios":vals,"uf":"RS"})
              return True

          async def click_exibir(page, log):
              b=page.locator("#ctl00_ctl00_Conteudo_AntesTabela_btnExibir")
              if not await b.count():
                  log.append({"action":"exibir_missing"})
                  return False
              await b.click(force=True)
              log.append({"action":"click_exibir"})
              await settle(page,2200)
              return True

          async def extract_tables(page):
              out=[]
              tables=page.locator("table")
              for ti in range(await tables.count()):
                  rows=[]
                  trs=tables.nth(ti).locator("tr")
                  for ri in range(await trs.count()):
                      cells=trs.nth(ri).locator("th,td")
                      vals=[]
                      for ci in range(await cells.count()):
                          try:
                              vals.append(re.sub(r"\s+"," ",(await cells.nth(ci).inner_text()).strip()))
                          except Exception:
                              vals.append("")
                      if vals and any(vals):
                          rows.append(vals)
                  if rows: out.append(rows)
              return out

          def result_rows(tables):
              hits=[]
              for ti,t in enumerate(tables):
                  for ri,row in enumerate(t):
                      # Avoid treating the selector list itself as a result row.
                      joined=" | ".join(row)
                      if norm(joined).find("SAO BORJA")>=0 and len(joined)<4000:
                          hits.append({"table":ti,"row":ri,"cells":row})
              return hits

          async def run_one(context, name, url, kind):
              page=await context.new_page()
              rec={"name":name,"url":url,"kind":kind,"log":[],"snapshots":[]}
              try:
                  resp=await page.goto(url,wait_until="domcontentloaded",timeout=120000)
                  rec["http_status"]=resp.status if resp else None
                  await settle(page,800)
                  rec["snapshots"].append(await snapshot(page,"initial"))

                  if kind=="total":
                      await select_and_postback(page,"#ctl00_ctl00_Conteudo_AntesTabela_droplistOpcao","Por Município",rec["log"])
                      # Use the latest month offered by the official page, not a hard-coded period.
                      month=page.locator("#ctl00_ctl00_Conteudo_AntesTabela_droplistMes")
                      if await month.count():
                          options=await month.locator("option").evaluate_all("(els)=>els.map(o=>({text:o.textContent,value:o.value})).filter(o=>o.value)")
                          if options:
                              latest=options[-1]
                              await month.select_option(value=latest["value"],force=True)
                              rec["log"].append({"action":"latest_month","value":latest["value"],"text":latest["text"]})
                  else:
                      await select_and_postback(page,"#ctl00_ctl00_Conteudo_AntesTabela_ddlColuna","Município",rec["log"])

                  # Set official UF/municipality filter and then request the table.
                  rec["filter_ok"]=await set_filter(page,rec["log"])
                  rec["snapshots"].append(await snapshot(page,"after_filter"))
                  rec["exibir_ok"]=await click_exibir(page,rec["log"])

                  # Some page states open the filter only on the first Exibir; if so,
                  # reproduce filter once more and submit again.
                  if not rec["filter_ok"]:
                      rec["filter_ok"]=await set_filter(page,rec["log"])
                      if rec["filter_ok"]:
                          rec["exibir_ok"]=await click_exibir(page,rec["log"])

                  rec["snapshots"].append(await snapshot(page,"final"))
                  rec["tables"]=await extract_tables(page)
                  rec["result_rows"]=result_rows(rec["tables"])
                  rec["final_url"]=page.url
                  rec["final_html"]=await page.content()
                  (OUT/f"{name}.html").write_text(rec["final_html"],encoding="utf-8")
                  await page.screenshot(path=str(OUT/f"{name}.png"),full_page=True)
                  rec.pop("final_html",None)
              except Exception as exc:
                  rec["error"]=repr(exc)
              finally:
                  (OUT/f"{name}.json").write_text(json.dumps(rec,ensure_ascii=False,indent=2),encoding="utf-8")
                  await page.close()
              return rec

          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True)
                  ctx=await browser.new_context(locale="pt-BR",viewport={"width":1800,"height":1400})
                  results=[]
                  for name,(url,kind) in PAGES.items():
                      results.append(await run_one(ctx,name,url,kind))
                  await browser.close()

              summary=[]
              for r in results:
                  summary.append({
                      "name":r["name"],
                      "http_status":r.get("http_status"),
                      "filter_ok":r.get("filter_ok"),
                      "exibir_ok":r.get("exibir_ok"),
                      "result_rows":r.get("result_rows",[]),
                      "error":r.get("error"),
                      "log":r.get("log",[]),
                  })
              (OUT/"summary.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding="utf-8")
              with (OUT/"sao_borja_rows.csv").open("w",newline="",encoding="utf-8") as f:
                  w=csv.writer(f)
                  w.writerow(["query","table_index","row_index","cells_json"])
                  for r in results:
                      for row in r.get("result_rows",[]):
                          w.writerow([r["name"],row["table"],row["row"],json.dumps(row["cells"],ensure_ascii=False)])
              print(json.dumps(summary,ensure_ascii=False,indent=2))

              # A green workflow is not evidence unless the municipal filter was applied.
              if not all(r.get("filter_ok") for r in results):
                  raise SystemExit("SINAC/SIMEI municipal filter was not reproduced for all four queries")

          asyncio.run(main())
          PY
          python /tmp/sinac_simei_sb.py

      - name: Persist exploratory evidence
        run: |
          mkdir -p docs/data_sources/sinac_simei_discovery
          cp artifacts/sinac_simei_sao_borja/summary.json docs/data_sources/sinac_simei_discovery/summary.json
          cp artifacts/sinac_simei_sao_borja/sao_borja_rows.csv docs/data_sources/sinac_simei_discovery/sao_borja_rows.csv
          for f in artifacts/sinac_simei_sao_borja/*.json artifacts/sinac_simei_sao_borja/*.html; do
            [ -f "$f" ] && cp "$f" docs/data_sources/sinac_simei_discovery/
          done
          cat > docs/data_sources/sinac_simei_discovery/README.md <<'EOF'
          # SINAC/SIMEI — reprodução municipal São Borja

          Evidência exploratória gerada automaticamente na branch
          `explore/receita-estadual-rs-market-intel-v1`.

          Fonte primária: Portal Estatísticas do Simples Nacional / Receita Federal.

          Regras:
          - nenhum valor é canônico;
          - preservar a posição de consolidação exibida pela própria página;
          - não usar cross-check secundário como substituto;
          - somente aceitar resultado quando São Borja estiver explicitamente presente
            na tabela de saída ou quando o controle da consulta comprovar o município selecionado.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data_sources/sinac_simei_discovery
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "data: reproduce SINAC SIMEI São Borja queries"
            git push origin HEAD:explore/receita-estadual-rs-market-intel-v1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sinac-simei-sao-borja
          retention-days: 30
          if-no-files-found: error
          path: artifacts/sinac_simei_sao_borja/
