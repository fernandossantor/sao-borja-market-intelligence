name: vaf-source-audit

on:
  pull_request:
    paths:
      - "src/sbmi/vaf_source_audit.py"
      - "tests/test_vaf_source_audit.py"
      - ".github/workflows/vaf-source-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Run focused tests and Ruff
        run: |
          python -m pytest tests/test_vaf_source_audit.py
          python -m ruff check src/sbmi/vaf_source_audit.py tests/test_vaf_source_audit.py
      - name: Fetch and audit official VAF history form
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          from pathlib import Path
          import requests
          from sbmi.vaf_source_audit import (
              VAF_HISTORY_FORM_URL,
              parse_vaf_form,
              summarize_form,
          )

          response = requests.get(VAF_HISTORY_FORM_URL, timeout=60)
          response.raise_for_status()
          structure = parse_vaf_form(response.text)
          summary = summarize_form(structure)
          summary['http_status'] = response.status_code
          summary['response_bytes'] = len(response.content)
          output = Path('artifacts/vaf_history_form_structure.json')
          output.write_text(
              json.dumps(summary, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )
          print(output.read_text(encoding='utf-8'))
          print('STATUS=VAF_HISTORY_FORM_AUDIT_OK')
          PY
      - name: Upload compact source audit
        uses: actions/upload-artifact@v4
        with:
          name: vaf-history-form-structure
          path: artifacts/vaf_history_form_structure.json
          retention-days: 14
