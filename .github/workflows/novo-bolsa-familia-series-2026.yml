name: novo-bolsa-familia-series-2026

on:
  pull_request:
    paths:
      - ".github/workflows/novo-bolsa-familia-series-2026.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-series:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build privacy-minimized Sao Borja monthly series for 2026-01 to 2026-07 with reference split
        run: |
          set -euo pipefail
          python -m pip install --upgrade requests
          mkdir -p artifacts/monthly
          python - <<'PY'
          import csv
          import hashlib
          import io
          import json
          import re
          import unicodedata
          import zipfile
          from collections import Counter, defaultdict
          from decimal import Decimal, InvalidOperation
          from pathlib import Path

          import requests

          SOURCE_PAGE = "https://portaldatransparencia.gov.br/download-de-dados/novo-bolsa-familia"
          MONTHS = [f"2026{m:02d}" for m in range(1, 8)]
          TARGET_UF = "RS"
          TARGET_MUNICIPALITY_NORM = "SAO BORJA"
          EXPECTED_SIAFI = "8863"

          session = requests.Session()
          session.headers.update({
              "User-Agent": "SBMI Novo Bolsa Familia monthly series/2.0",
              "Referer": SOURCE_PAGE,
          })

          def norm(value):
              value = unicodedata.normalize("NFKD", str(value))
              value = "".join(c for c in value if not unicodedata.combining(c))
              value = value.upper().strip()
              value = re.sub(r"[^A-Z0-9]+", " ", value)
              return re.sub(r"\s+", " ", value).strip()

          def parse_decimal(raw):
              s = str(raw).strip().replace("R$", "").replace(" ", "")
              if not s:
                  return None
              if "," in s and "." in s:
                  if s.rfind(",") > s.rfind("."):
                      s = s.replace(".", "").replace(",", ".")
                  else:
                      s = s.replace(",", "")
              elif "," in s:
                  s = s.replace(".", "").replace(",", ".")
              try:
                  return Decimal(s)
              except InvalidOperation:
                  return None

          series = []
          source_manifest = []
          schemas = {}
          reference_detail = {}

          for month in MONTHS:
              download_url = f"{SOURCE_PAGE}/{month}"
              target = Path(f"/tmp/novo_bolsa_familia_{month}.zip")
              sha = hashlib.sha256()
              total_bytes = 0

              with session.get(download_url, stream=True, timeout=(30, 600), allow_redirects=True) as r:
                  headers = {
                      "status": r.status_code,
                      "final_url": r.url,
                      "content_type": r.headers.get("content-type"),
                      "content_length": r.headers.get("content-length"),
                      "etag": r.headers.get("etag"),
                      "last_modified": r.headers.get("last-modified"),
                  }
                  r.raise_for_status()
                  with target.open("wb") as f:
                      for chunk in r.iter_content(chunk_size=8 * 1024 * 1024):
                          if chunk:
                              f.write(chunk)
                              sha.update(chunk)
                              total_bytes += len(chunk)

              if headers["content_length"] and str(headers["content_length"]).isdigit():
                  expected = int(headers["content_length"])
                  if total_bytes != expected:
                      raise SystemExit(f"{month}: download size mismatch {total_bytes} != {expected}")
              if not zipfile.is_zipfile(target):
                  raise SystemExit(f"{month}: response is not ZIP")

              national_rows = 0
              bad_width_rows = 0
              municipal_records = 0
              valid_value_records = 0
              total_value = Decimal("0")
              unique_nis = set()
              unique_cpf = set()
              blank_nis = 0
              blank_cpf = 0
              siafi_codes = Counter()
              competencia = Counter()
              referencia = defaultdict(lambda: {"records": 0, "value": Decimal("0")})
              schema_records = []

              with zipfile.ZipFile(target) as z:
                  for info in z.infolist():
                      if info.is_dir():
                          continue
                      with z.open(info) as raw:
                          first = raw.readline()
                          encoding = None
                          header_text = None
                          for enc in ("utf-8-sig", "utf-8", "latin-1"):
                              try:
                                  header_text = first.decode(enc)
                                  encoding = enc
                                  break
                              except UnicodeDecodeError:
                                  pass
                          if encoding is None:
                              raise SystemExit(f"{month}: unable to decode header in {info.filename}")
                          delimiter = ";" if header_text.count(";") >= header_text.count(",") else ","
                          headers_src = next(csv.reader([header_text.strip("\r\n")], delimiter=delimiter))
                          normalized_headers = [norm(h) for h in headers_src]

                          def idx(label):
                              label_n = norm(label)
                              matches = [i for i, h in enumerate(normalized_headers) if h == label_n]
                              return matches[0] if matches else None

                          uf_idx = idx("UF")
                          mun_idx = idx("NOME MUNICIPIO")
                          siafi_idx = idx("CODIGO MUNICIPIO SIAFI")
                          comp_idx = idx("MES COMPETENCIA")
                          ref_idx = idx("MES REFERENCIA")
                          value_idx = idx("VALOR PARCELA")
                          nis_idx = idx("NIS FAVORECIDO")
                          cpf_idx = idx("CPF FAVORECIDO")
                          required = {
                              "UF": uf_idx,
                              "NOME MUNICIPIO": mun_idx,
                              "MES COMPETENCIA": comp_idx,
                              "MES REFERENCIA": ref_idx,
                              "VALOR PARCELA": value_idx,
                          }
                          missing = [k for k, v in required.items() if v is None]
                          if missing:
                              raise SystemExit(f"{month}: required columns missing in {info.filename}: {missing}")

                          schema_records.append({
                              "member": info.filename,
                              "encoding": encoding,
                              "delimiter": delimiter,
                              "source_header_columns": headers_src,
                              "normalized_header_columns": normalized_headers,
                          })

                          text = io.TextIOWrapper(raw, encoding=encoding, errors="strict", newline="")
                          reader = csv.reader(text, delimiter=delimiter)
                          for row in reader:
                              national_rows += 1
                              if len(row) != len(headers_src):
                                  bad_width_rows += 1
                                  continue
                              if row[uf_idx].strip().upper() != TARGET_UF or norm(row[mun_idx]) != TARGET_MUNICIPALITY_NORM:
                                  continue
                              municipal_records += 1
                              if siafi_idx is not None:
                                  siafi_codes[row[siafi_idx].strip()] += 1
                              comp = row[comp_idx].strip()
                              ref = row[ref_idx].strip()
                              competencia[comp] += 1
                              value = parse_decimal(row[value_idx])
                              if value is not None:
                                  valid_value_records += 1
                                  total_value += value
                                  referencia[ref]["value"] += value
                              referencia[ref]["records"] += 1
                              if nis_idx is not None:
                                  nis = row[nis_idx].strip()
                                  if nis:
                                      unique_nis.add(nis)
                                  else:
                                      blank_nis += 1
                              if cpf_idx is not None:
                                  cpf = row[cpf_idx].strip()
                                  if cpf:
                                      unique_cpf.add(cpf)
                                  else:
                                      blank_cpf += 1

              if municipal_records == 0:
                  raise SystemExit(f"{month}: no Sao Borja/RS records found")
              if valid_value_records != municipal_records:
                  raise SystemExit(f"{month}: invalid VALOR PARCELA coverage {valid_value_records}/{municipal_records}")
              if siafi_codes and set(siafi_codes) != {EXPECTED_SIAFI}:
                  raise SystemExit(f"{month}: unexpected SIAFI codes {dict(siafi_codes)}")
              if set(competencia) != {month}:
                  raise SystemExit(f"{month}: unexpected MES COMPETENCIA values {dict(competencia)}")

              current = referencia.get(month, {"records": 0, "value": Decimal("0")})
              prior_records = sum(v["records"] for k, v in referencia.items() if k < month)
              prior_value = sum((v["value"] for k, v in referencia.items() if k < month), Decimal("0"))
              future_records = sum(v["records"] for k, v in referencia.items() if k > month)
              future_value = sum((v["value"] for k, v in referencia.items() if k > month), Decimal("0"))
              if current["records"] + prior_records + future_records != municipal_records:
                  raise SystemExit(f"{month}: reference decomposition does not reconcile records")
              if current["value"] + prior_value + future_value != total_value:
                  raise SystemExit(f"{month}: reference decomposition does not reconcile value")

              avg = total_value / municipal_records
              current_avg = current["value"] / current["records"] if current["records"] else None
              current_share = current["value"] / total_value * Decimal("100") if total_value else Decimal("0")
              prior_share = prior_value / total_value * Decimal("100") if total_value else Decimal("0")
              future_share = future_value / total_value * Decimal("100") if total_value else Decimal("0")

              row = {
                  "periodo_competencia": f"{month[:4]}-{month[4:]}",
                  "download_label": month,
                  "registros_total": municipal_records,
                  "soma_valor_parcela_total_rs": f"{total_value:.2f}",
                  "media_total_por_registro_rs": f"{avg:.2f}",
                  "registros_referencia_corrente": current["records"],
                  "valor_referencia_corrente_rs": f"{current['value']:.2f}",
                  "media_referencia_corrente_rs": f"{current_avg:.2f}" if current_avg is not None else "",
                  "pct_valor_referencia_corrente": f"{current_share:.5f}",
                  "registros_referencias_anteriores": prior_records,
                  "valor_referencias_anteriores_rs": f"{prior_value:.2f}",
                  "pct_valor_referencias_anteriores": f"{prior_share:.5f}",
                  "registros_referencias_futuras": future_records,
                  "valor_referencias_futuras_rs": f"{future_value:.2f}",
                  "pct_valor_referencias_futuras": f"{future_share:.5f}",
                  "referencias_distintas": len(referencia),
                  "referencia_min": min(referencia) if referencia else "",
                  "referencia_max": max(referencia) if referencia else "",
                  "nis_unicos_nao_vazios": len(unique_nis),
                  "cpf_unicos_nao_vazios": len(unique_cpf),
                  "nis_vazios": blank_nis,
                  "cpf_vazios": blank_cpf,
                  "siafi_observado": ";".join(sorted(siafi_codes)),
                  "linhas_nacionais_lidas": national_rows,
                  "linhas_largura_invalida": bad_width_rows,
                  "natureza": "calculado_a_partir_de_registros_oficiais",
              }
              series.append(row)
              schemas[month] = schema_records
              reference_detail[month] = {
                  k: {"records": v["records"], "sum_valor_parcela_rs": f"{v['value']:.2f}"}
                  for k, v in sorted(referencia.items())
              }
              source_manifest.append({
                  "month": month,
                  "download_url": download_url,
                  "final_url": headers["final_url"],
                  "status": headers["status"],
                  "content_type": headers["content_type"],
                  "content_length": headers["content_length"],
                  "downloaded_bytes": total_bytes,
                  "download_sha256": sha.hexdigest(),
                  "etag": headers["etag"],
                  "last_modified": headers["last_modified"],
                  "raw_national_file_persisted": False,
              })

              Path(f"artifacts/monthly/{month}_validation_v002.json").write_text(
                  json.dumps({"series_row": row, "by_mes_referencia": reference_detail[month]}, ensure_ascii=False, indent=2),
                  encoding="utf-8",
              )
              target.unlink(missing_ok=True)

          fields = list(series[0].keys())
          with Path("artifacts/novo_bolsa_familia_sao_borja_2026_01_07_series_v002.csv").open("w", encoding="utf-8", newline="") as f:
              w = csv.DictWriter(f, fieldnames=fields)
              w.writeheader()
              w.writerows(series)

          Path("artifacts/novo_bolsa_familia_sao_borja_2026_01_07_series_v002.json").write_text(
              json.dumps(series, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          Path("artifacts/novo_bolsa_familia_2026_01_07_reference_detail_v002.json").write_text(
              json.dumps(reference_detail, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          Path("artifacts/novo_bolsa_familia_2026_01_07_source_manifest_v002.json").write_text(
              json.dumps(source_manifest, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          Path("artifacts/novo_bolsa_familia_2026_01_07_schemas_v002.json").write_text(
              json.dumps(schemas, ensure_ascii=False, indent=2), encoding="utf-8"
          )

          summary = {
              "geography": "São Borja/RS",
              "periods": [r["periodo_competencia"] for r in series],
              "months_count": len(series),
              "coverage_rule": "total competence flow is separated from same-month MES REFERENCIA and prior/future reference adjustments",
              "privacy_control": "No CPF, NIS or beneficiary names are persisted; only aggregate counts are retained.",
              "interpretation_limit": "Competence totals may include parcels referring to prior months; records/parcels are not automatically unique families; VALOR PARCELA is not observed consumption or local retention.",
          }
          Path("artifacts/novo_bolsa_familia_sao_borja_2026_01_07_summary_v002.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(series, ensure_ascii=False, indent=2))
          PY
      - name: Upload monthly series artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novo-bolsa-familia-sao-borja-2026-01-07-series-v002
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
