name: rais-wage-territorial-data

on:
  push:
    branches:
      - feature/cnpj-territorial-control-v1
    paths:
      - '.github/workflows/rais-wage-territorial-data.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      RFB_COMPETENCE: '2026-08'
      RFB_BASE_URL: 'https://dadosabertos.rfb.gov.br/CNPJ/dados_abertos_cnpj'
      RAIS_EXPECTED_SIZE: '704888712'
      RAIS_EXPECTED_SHA256: 'c537caaaa8318b04e6f4cbbc7e59b130988668b7ea58ce67a0ab2caebf2f5bd0'
      RAIS_OFFICIAL_URL: 'ftp://ftp.mtps.gov.br/pdet/microdados/RAIS/2025/RAIS_VINC_PUB_SUL.7z'
      RAIS_MIRROR_URL: 'https://huggingface.co/datasets/selenelindsay/rais-caged-bronze/resolve/cc087930d43339cbf66dd9511ee6d39c661c3084/RAIS/2025/RAIS_VINC_PUB_SUL.7z?download=true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and 7-Zip
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          if ! command -v 7z >/dev/null 2>&1 && ! command -v 7zz >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y p7zip-full
          fi

      - name: Verify codebase
        run: make verify

      - name: Download official RFB CNPJ 2026-08 files
        shell: bash
        run: |
          set -euo pipefail
          raw=".data/raw/rfb_cnpj/${RFB_COMPETENCE}"
          audit='.data/audit/base_territorial/rais2025_wage/rfb_source_integrity'
          mkdir -p "$raw" "$audit"

          download_file() {
            local file="$1"
            local out="$raw/$file"
            local partial="${out}.partial"
            local url="${RFB_BASE_URL}/${RFB_COMPETENCE}/${file}"
            rm -f "$partial"
            echo "Downloading ${url}"
            curl \
              --fail \
              --location \
              --retry 5 \
              --retry-all-errors \
              --retry-delay 5 \
              --connect-timeout 30 \
              --output "$partial" \
              "$url"
            test -s "$partial"
            unzip -tq "$partial" >/dev/null
            mv "$partial" "$out"
            du -h "$out"
          }

          echo 'Disk before RFB download:'
          df -h .
          download_file Municipios.zip
          for i in {0..9}; do download_file "Estabelecimentos${i}.zip"; done
          for i in {0..9}; do download_file "Empresas${i}.zip"; done
          echo 'Disk after RFB download:'
          df -h .
          du -sh "$raw"
          sha256sum "$raw"/*.zip | sort > "$audit/SHA256SUMS.txt"
          printf 'declared_source=Receita Federal — Dados Abertos CNPJ\ncompetence=%s\nbase_url=%s\nfile_count=21\nSTATUS=RFB_SOURCE_DOWNLOAD_VERIFIED\n' \
            "$RFB_COMPETENCE" "$RFB_BASE_URL" > "$audit/source_metadata.txt"
          cat "$audit/source_metadata.txt"

      - name: Build audited RFB territorial-control base
        shell: bash
        run: |
          set -euo pipefail
          raw=".data/raw/rfb_cnpj/${RFB_COMPETENCE}"
          execution_id="cnpj-territorial-control-${RFB_COMPETENCE}-wage-actions-${GITHUB_RUN_ID}"
          python -m sbmi.cnpj_territorial_control_cli \
            --establishments-dir "$raw" \
            --companies-dir "$raw" \
            --municipalities-zip "$raw/Municipios.zip" \
            --execution-id "$execution_id" \
            --municipality-tom 8863 \
            --municipality-ibge 4318002 \
            --active-status-code 02 \
            --chunksize 200000

          canonical=".data/curated/base_territorial/cnpj_territorial_control/${execution_id}/cnpj_territorial_control.csv"
          validation=".data/audit/base_territorial/cnpj_territorial_control/${execution_id}/validation.csv"
          test -f "$canonical"
          test -f "$validation"
          echo "RFB_EXECUTION_ID=${execution_id}" >> "$GITHUB_ENV"
          echo "RFB_CANONICAL=${canonical}" >> "$GITHUB_ENV"
          echo "RFB_VALIDATION=${validation}" >> "$GITHUB_ENV"
          echo '--- RFB validation ---'
          cat "$validation"

      - name: Validate RFB territorial-control benchmark
        shell: bash
        run: |
          set -euo pipefail
          python - "$RFB_CANONICAL" "$RFB_VALIDATION" <<'PY'
          import sys
          import pandas as pd

          canonical_path, validation_path = sys.argv[1:3]
          df = pd.read_csv(canonical_path, dtype=str, keep_default_na=False)
          validation = pd.read_csv(validation_path, dtype=str, keep_default_na=False)

          if 'FAIL' in set(validation['status']):
              raise SystemExit('STATUS=RFB_VALIDATION_FAIL')
          if len(df) != 7306:
              raise SystemExit(f'STATUS=RFB_ROWS_FAIL observed={len(df)} expected=7306')

          external_all = int(df['territorial_control_status'].eq('FILIAL_DE_MATRIZ_EXTERNA').sum())
          business = df[df['natureza_juridica'].astype(str).str.zfill(4).str.startswith('2')]
          external_business = int(
              business['territorial_control_status'].eq('FILIAL_DE_MATRIZ_EXTERNA').sum()
          )
          if external_all != 323:
              raise SystemExit(
                  f'STATUS=RFB_EXTERNAL_ALL_FAIL observed={external_all} expected=323'
              )
          if len(business) != 6906:
              raise SystemExit(
                  f'STATUS=RFB_BUSINESS_TOTAL_FAIL observed={len(business)} expected=6906'
              )
          if external_business != 284:
              raise SystemExit(
                  'STATUS=RFB_EXTERNAL_BUSINESS_FAIL '
                  f'observed={external_business} expected=284'
              )
          print(f'rfb_rows={len(df)}')
          print(f'rfb_external_all={external_all}')
          print(f'rfb_business={len(business)}')
          print(f'rfb_external_business={external_business}')
          print('STATUS=RFB_TERRITORIAL_BENCHMARK_OK')
          PY

      - name: Build audited RFB CNAE x nature territorial cells
        shell: bash
        run: |
          set -euo pipefail
          out='.data/staging/base_territorial/rais2025_wage/rfb_cnae_nature_territorial_cells_v001.csv'
          mkdir -p "$(dirname "$out")"
          python - "$RFB_CANONICAL" "$out" <<'PY'
          import sys
          from pathlib import Path
          import pandas as pd

          source = Path(sys.argv[1])
          output = Path(sys.argv[2])
          df = pd.read_csv(source, dtype=str, keep_default_na=False)
          statuses = {
              'MATRIZ_LOCAL',
              'FILIAL_DE_MATRIZ_LOCAL',
              'FILIAL_DE_MATRIZ_EXTERNA',
          }
          work = df.copy()
          work['cnae_subclass'] = work['cnae_fiscal_principal'].astype(str).str.strip().str.zfill(7)
          work['natureza_juridica'] = work['natureza_juridica'].astype(str).str.strip().str.zfill(4)
          work = work[
              work['natureza_juridica'].str.startswith('2')
              & work['territorial_control_status'].isin(statuses)
          ]
          cells = (
              work.groupby(
                  ['cnae_subclass', 'natureza_juridica', 'territorial_control_status'],
                  as_index=False,
              )
              .size()
              .rename(columns={'size': 'estabelecimentos'})
              .sort_values(['cnae_subclass', 'natureza_juridica', 'territorial_control_status'])
              .reset_index(drop=True)
          )
          total = int(cells['estabelecimentos'].sum())
          external = int(
              cells.loc[
                  cells['territorial_control_status'].eq('FILIAL_DE_MATRIZ_EXTERNA'),
                  'estabelecimentos',
              ].sum()
          )
          if total != 6906:
              raise SystemExit(f'STATUS=RFB_BUSINESS_TOTAL_FAIL observed={total} expected=6906')
          if external != 284:
              raise SystemExit(f'STATUS=RFB_EXTERNAL_TOTAL_FAIL observed={external} expected=284')
          if len(cells) != 982:
              raise SystemExit(f'STATUS=RFB_CELL_COUNT_FAIL observed={len(cells)} expected=982')
          cells.to_csv(output, index=False)
          print(f'rfb_cells={len(cells)}')
          print(f'rfb_business_establishments={total}')
          print(f'rfb_external_business_establishments={external}')
          print(f'output={output}')
          print('STATUS=RFB_WAGE_CELLS_OK')
          PY
          echo "RFB_CELLS=${out}" >> "$GITHUB_ENV"
          sha256sum "$out"

      - name: Download and verify RAIS Vínculos Sul 2025
        shell: bash
        run: |
          set -euo pipefail
          raw='.data/raw/rais/2025/RAIS_VINC_PUB_SUL.7z'
          partial="${raw}.partial"
          audit='.data/audit/base_territorial/rais2025_wage/rais_vinc_source_integrity.txt'
          mkdir -p "$(dirname "$raw")" "$(dirname "$audit")"
          rm -f "$partial"
          transport='mte_ftp'
          if ! curl --fail --location --ftp-pasv --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 30 \
            --output "$partial" "$RAIS_OFFICIAL_URL"; then
            echo 'Official MTE FTP unavailable; using integrity-verified transport mirror.'
            rm -f "$partial"
            transport='huggingface_transport_mirror'
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 30 \
              --output "$partial" "$RAIS_MIRROR_URL"
          fi
          size="$(stat -c%s "$partial")"
          sha="$(sha256sum "$partial" | awk '{print $1}')"
          printf 'transport=%s\nsize=%s\nsha256=%s\nexpected_size=%s\nexpected_sha256=%s\n' \
            "$transport" "$size" "$sha" "$RAIS_EXPECTED_SIZE" "$RAIS_EXPECTED_SHA256" | tee "$audit"
          if [[ "$size" != "$RAIS_EXPECTED_SIZE" ]]; then
            echo 'STATUS=RAIS_SIZE_FAIL' >&2
            exit 40
          fi
          if [[ "$sha" != "$RAIS_EXPECTED_SHA256" ]]; then
            echo 'STATUS=RAIS_SHA256_FAIL' >&2
            exit 41
          fi
          mv "$partial" "$raw"
          echo "RAIS_ARCHIVE=${raw}" >> "$GITHUB_ENV"
          echo 'STATUS=RAIS_ARCHIVE_VERIFIED' | tee -a "$audit"

      - name: Extract São Borja workers in streaming mode
        shell: bash
        run: |
          set -euo pipefail
          out='.data/staging/rais/2025/rais_vinc_2025_sao_borja_extract_v001.csv'
          audit='.data/audit/base_territorial/rais2025_wage/rais_vinc_2025_sao_borja_extraction_v001.txt'
          mkdir -p "$(dirname "$out")" "$(dirname "$audit")"
          python - "$RAIS_ARCHIVE" "$out" "$audit" <<'PY'
          import csv
          import hashlib
          import io
          import shutil
          import subprocess
          import sys
          import time
          from pathlib import Path

          archive = Path(sys.argv[1])
          output = Path(sys.argv[2])
          audit = Path(sys.argv[3])
          member = 'RAIS_VINC_PUB_SUL.COMT'
          municipality = '431800'
          sevenzip = shutil.which('7zz') or shutil.which('7z') or shutil.which('7za')
          if not sevenzip:
              raise SystemExit('STATUS=SEVENZIP_NOT_FOUND')
          start = time.time()
          proc = subprocess.Popen(
              [sevenzip, 'x', '-so', str(archive), member],
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
          )
          text = io.TextIOWrapper(proc.stdout, encoding='latin-1', newline='', errors='strict')
          reader = csv.reader(text, delimiter=',', quotechar='"')
          header = next(reader)
          if len(header) != 62:
              proc.kill()
              raise SystemExit(f'STATUS=RAIS_HEADER_WIDTH_FAIL observed={len(header)} expected=62')
          required = {
              'Município - Código',
              'CNAE 2.0 Subclasse - Codigo',
              'Natureza Jurídica - Código',
              'Ind Vínculo Ativo 31/12 - Código',
              'Ind Vínculo Abandonado - Código',
              'Tipo Estabelecimento - Código',
              'Vl Rem Dezembro Nom',
              'Vl Rem Média Nom',
          }
          missing = sorted(required - set(header))
          if missing:
              proc.kill()
              raise SystemExit(f'STATUS=RAIS_REQUIRED_COLUMNS_FAIL missing={missing}')
          municipality_idx = header.index('Município - Código')
          rows_source = 0
          rows_sb = 0
          with output.open('w', encoding='utf-8', newline='') as fout:
              writer = csv.writer(fout)
              writer.writerow(header)
              for row in reader:
                  rows_source += 1
                  if len(row) != len(header):
                      proc.kill()
                      raise SystemExit(
                          f'STATUS=RAIS_ROW_WIDTH_FAIL row={rows_source} '
                          f'observed={len(row)} expected={len(header)}'
                      )
                  code = str(row[municipality_idx]).strip().strip('"')
                  if code.endswith('.0'):
                      code = code[:-2]
                  if code == municipality:
                      writer.writerow(row)
                      rows_sb += 1
                  if rows_source % 5_000_000 == 0:
                      print(f'rows_source={rows_source} rows_sao_borja={rows_sb}', flush=True)
          stderr = proc.stderr.read().decode('utf-8', errors='replace')
          rc = proc.wait()
          if rc != 0:
              raise SystemExit(f'STATUS=RAIS_7ZIP_STREAM_FAIL rc={rc} stderr={stderr[-2000:]}')
          if rows_sb != 19960:
              raise SystemExit(f'STATUS=RAIS_SB_ROWS_FAIL observed={rows_sb} expected=19960')
          digest = hashlib.sha256()
          with output.open('rb') as fh:
              for block in iter(lambda: fh.read(8 * 1024 * 1024), b''):
                  digest.update(block)
          lines = [
              'source=' + str(archive),
              'member=' + member,
              'municipality_filter=' + municipality,
              f'columns={len(header)}',
              f'rows_source={rows_source}',
              f'rows_sao_borja={rows_sb}',
              'output=' + str(output),
              f'output_size={output.stat().st_size}',
              'output_sha256=' + digest.hexdigest(),
              f'elapsed_seconds={time.time() - start:.3f}',
              'STATUS=RAIS2025_SAO_BORJA_EXTRACTION_OK',
          ]
          audit.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print('\n'.join(lines))
          PY
          echo "RAIS_SB_EXTRACT=${out}" >> "$GITHUB_ENV"

      - name: Run dedicated estimator tests
        run: python -m pytest tests/test_territorial_wage_estimation.py tests/test_territorial_employment_estimation.py

      - name: Run real RAIS 2025 x RFB 2026-08 wage pipeline
        shell: bash
        run: |
          set -euo pipefail
          execution_id="territorial-wage-rais2025-rfb2026-08-actions-${GITHUB_RUN_ID}"
          out=".data/exports/base_territorial/territorial_wage_estimation/${execution_id}"
          python -m sbmi.territorial_wage_estimation_cli \
            --rais-workers-csv "$RAIS_SB_EXTRACT" \
            --rfb-cells-csv "$RFB_CELLS" \
            --output-dir "$out" \
            --municipality-code 431800 \
            --rais-reference-year 2025 \
            --rfb-competence 2026-08 \
            --expected-business-active-links 8595
          echo "WAGE_OUTPUT_DIR=${out}" >> "$GITHUB_ENV"
          echo "EXECUTION_ID=${execution_id}" >> "$GITHUB_ENV"

      - name: Validate real outputs and benchmark reproduction
        shell: bash
        run: |
          set -euo pipefail
          echo '--- validation.csv ---'
          cat "$WAGE_OUTPUT_DIR/validation.csv"
          echo '--- territorial_wage_summary.csv ---'
          cat "$WAGE_OUTPUT_DIR/territorial_wage_summary.csv"
          echo '--- territorial_wage_coverage.csv ---'
          cat "$WAGE_OUTPUT_DIR/territorial_wage_coverage.csv"
          python - "$WAGE_OUTPUT_DIR/territorial_wage_summary.csv" <<'PY'
          import sys
          import pandas as pd

          summary = pd.read_csv(sys.argv[1]).set_index('indicator')['value']
          checks = {
              'rais_business_active_links': (8595.0, 0.0),
              'estimated_external_active_links_share_pct': (25.16055458, 0.0001),
              'estimated_external_avg_rem_sum_share_pct': (29.0903, 0.001),
              'estimated_external_dec_mass_share_pct': (29.6897, 0.001),
          }
          for indicator, (expected, tolerance) in checks.items():
              observed = float(summary[indicator])
              diff = abs(observed - expected)
              print(
                  f'{indicator}: observed={observed:.8f} expected={expected:.8f} '
                  f'diff={diff:.8f} tolerance={tolerance}'
              )
              if diff > tolerance:
                  raise SystemExit(f'STATUS=BENCHMARK_FAIL indicator={indicator}')
          print('STATUS=RAIS2025_WAGE_BENCHMARKS_OK')
          PY

      - name: Create execution manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest='.data/audit/base_territorial/rais2025_wage/actions_execution_manifest.txt'
          mkdir -p "$(dirname "$manifest")"
          {
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit_sha=${GITHUB_SHA}"
            echo "rfb_competence=${RFB_COMPETENCE}"
            echo "rfb_base_url=${RFB_BASE_URL}"
            echo "rfb_execution_id=${RFB_EXECUTION_ID}"
            echo "execution_id=${EXECUTION_ID}"
            echo "rais_archive_size=$(stat -c%s "$RAIS_ARCHIVE")"
            echo "rais_archive_sha256=$(sha256sum "$RAIS_ARCHIVE" | awk '{print $1}')"
            echo "rais_extract_sha256=$(sha256sum "$RAIS_SB_EXTRACT" | awk '{print $1}')"
            echo "rfb_canonical_sha256=$(sha256sum "$RFB_CANONICAL" | awk '{print $1}')"
            echo "rfb_cells_sha256=$(sha256sum "$RFB_CELLS" | awk '{print $1}')"
            echo 'STATUS=RAIS2025_WAGE_ACTIONS_EXECUTION_OK'
          } | tee "$manifest"

      - name: Upload compact wage analytical outputs
        uses: actions/upload-artifact@v4
        with:
          name: territorial-wage-rais2025-rfb2026-08-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ env.WAGE_OUTPUT_DIR }}/
            ${{ env.RAIS_SB_EXTRACT }}
            ${{ env.RFB_CELLS }}
            .data/audit/base_territorial/rais2025_wage/
            .data/audit/base_territorial/cnpj_territorial_control/${{ env.RFB_EXECUTION_ID }}/validation.csv
            .data/audit/base_territorial/cnpj_territorial_control/${{ env.RFB_EXECUTION_ID }}/source_manifest.csv
