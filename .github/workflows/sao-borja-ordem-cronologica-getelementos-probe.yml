name: sao-borja-ordem-cronologica-getelementos-probe
on:
  push:
    branches: [explore/receita-estadual-rs-market-intel-v1]
    paths: [".github/workflows/sao-borja-ordem-cronologica-getelementos-probe.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: explore/receita-estadual-rs-market-intel-v1
      - run: python -m pip install --quiet requests
      - name: Probe bounded endpoint
        shell: bash
        run: |
          python - <<'PY'
          import json,requests
          from pathlib import Path
          base="https://transparencia.saoborja.rs.gov.br"
          out=Path("docs/data_sources/sao_borja_ordem_cronologica_getelementos_probe")
          out.mkdir(parents=True,exist_ok=True)
          s=requests.Session()
          params={"iIdLink":"1","iInstituicao":"1","iExercicio":"2025","iPago":"1","iTipoLista":"1","dtInicio":"01/01/2025","dtFim":"31/12/2025"}
          payload={"aParametros":json.dumps(params,separators=(",",":")),"page":"1","rows":"10","sidx":"vencimento","sord":"asc"}
          r=s.post(base+"/ordem_cronologica/getElementos",data=payload,timeout=30)
          rec={"status":r.status_code,"bytes":len(r.content),"content_type":r.headers.get("content-type")}
          try:
            data=r.json()
            rec.update({"json":True,"top_keys":list(data.keys()),"page":data.get("page"),"total":data.get("total"),"records":data.get("records"),"returned_rows":len(data.get("rows",[]))})
            rows=data.get("rows",[])
            if rows:
              item=rows[0]
              if isinstance(item,dict):
                rec["row_keys"]=list(item.keys())
                rec["cell_count"]=len(item.get("cell",[])) if isinstance(item.get("cell"),list) else None
          except Exception as e:
            rec.update({"json":False,"error":repr(e),"prefix":r.text[:500]})
          (out/"probe.json").write_text(json.dumps(rec,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(rec,ensure_ascii=False,indent=2))
          PY
      - name: Persist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data_sources/sao_borja_ordem_cronologica_getelementos_probe
          git commit -m "data: probe bounded PMSB order endpoint" || exit 0
          git pull --rebase origin explore/receita-estadual-rs-market-intel-v1
          git push origin HEAD:explore/receita-estadual-rs-market-intel-v1
