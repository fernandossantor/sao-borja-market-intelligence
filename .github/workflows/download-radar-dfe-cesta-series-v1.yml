name: download-radar-dfe-cesta-series-v1

on:
  push:
    branches: [feature/cnpj-territorial-control-v1]
    paths: [".github/workflows/download-radar-dfe-cesta-series-v1.yml"]
  pull_request:
    branches: [main]
    paths: [".github/workflows/download-radar-dfe-cesta-series-v1.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet requests

      - name: Download and audit public series
        run: |
          set -euo pipefail
          mkdir -p artifacts/series_publicas
          cat > /tmp/download_series.py <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import io
          import json
          import os
          import re
          import zipfile
          from pathlib import Path

          import requests

          OUT = Path("artifacts/series_publicas")
          RAW = OUT / "raw"
          RAW.mkdir(parents=True, exist_ok=True)

          YEARS = list(range(2018, 2027))
          MONTHS = list(range(1, 13))

          session = requests.Session()
          session.headers.update({
              "User-Agent": "SBMI/1.0 public-data downloader (academic market-intelligence project)"
          })

          manifest = []
          availability = {}

          def sha256_bytes(b: bytes) -> str:
              return hashlib.sha256(b).hexdigest()

          def looks_like_html(b: bytes) -> bool:
              h = b[:500].lstrip().lower()
              return h.startswith(b"<!doctype html") or h.startswith(b"<html")

          def sniff_csv(b: bytes):
              sample = b[:200000]
              enc = "utf-8"
              text = None
              for candidate in ("utf-8-sig", "utf-8", "cp1252", "latin1"):
                  try:
                      text = sample.decode(candidate)
                      enc = candidate
                      break
                  except UnicodeDecodeError:
                      pass
              if text is None:
                  text = sample.decode("latin1", errors="replace")
                  enc = "latin1"
              first = text.splitlines()[0] if text.splitlines() else ""
              delim = ";" if first.count(";") >= first.count(",") else ","
              header = [x.strip() for x in first.split(delim)]
              return enc, delim, header

          def count_rows_bytes(b: bytes) -> int:
              if not b:
                  return 0
              return max(0, b.count(b"\n") - 1)

          def fetch(kind: str, url: str, relpath: str, expected: str):
              rec = {
                  "kind": kind,
                  "url": url,
                  "relative_path": relpath,
                  "status": None,
                  "available": False,
                  "bytes": 0,
                  "sha256": "",
                  "content_type": "",
                  "format": expected,
                  "rows_approx": "",
                  "encoding": "",
                  "delimiter": "",
                  "header": "",
                  "zip_members": "",
                  "note": "",
              }
              try:
                  r = session.get(url, timeout=60)
                  rec["status"] = r.status_code
                  rec["content_type"] = r.headers.get("content-type", "")
                  b = r.content
                  if r.status_code != 200 or not b or looks_like_html(b):
                      rec["note"] = "not available / non-data response"
                      manifest.append(rec)
                      return False

                  if expected == "zip":
                      try:
                          zf = zipfile.ZipFile(io.BytesIO(b))
                          members = [z.filename for z in zf.infolist() if not z.is_dir()]
                          rec["zip_members"] = "|".join(members)
                          if not members:
                              rec["note"] = "empty zip"
                              manifest.append(rec)
                              return False
                      except zipfile.BadZipFile:
                          rec["note"] = "invalid zip"
                          manifest.append(rec)
                          return False
                  else:
                      enc, delim, header = sniff_csv(b)
                      rec["encoding"] = enc
                      rec["delimiter"] = delim
                      rec["header"] = "|".join(header)
                      rec["rows_approx"] = count_rows_bytes(b)
                      if len(header) < 2:
                          rec["note"] = "CSV header not plausible"
                          manifest.append(rec)
                          return False

                  path = RAW / relpath
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(b)
                  rec["available"] = True
                  rec["bytes"] = len(b)
                  rec["sha256"] = sha256_bytes(b)
                  manifest.append(rec)
                  return True
              except Exception as exc:
                  rec["note"] = f"{type(exc).__name__}: {exc}"
                  manifest.append(rec)
                  return False

          # 1) Radar do Mercado — composição mensal
          for year in YEARS:
              for month in MONTHS:
                  fn = f"Composicao_de_Mercado_{month:02d}_{year}.csv"
                  url = f"https://arquivosradar.sefaz.rs.gov.br/RadarMercadoGaucho/Dados_Abertos/{fn}"
                  ok = fetch("radar_composicao_mercado", url, f"radar/composicao/{year}/{fn}", "csv")
                  availability[f"composicao_{year}_{month:02d}"] = ok

          # 2) Radar do Mercado — exportações por NCM
          for year in YEARS:
              for month in MONTHS:
                  fn = f"Exportacoes_NCM_{month:02d}_{year}.csv"
                  url = f"https://arquivosradar.sefaz.rs.gov.br/RadarMercadoGaucho/Dados_Abertos/{fn}"
                  ok = fetch("radar_exportacoes_ncm", url, f"radar/exportacoes/{year}/{fn}", "csv")
                  availability[f"exportacoes_{year}_{month:02d}"] = ok

          # 3) Radar — portfólio NCM × setor
          fetch(
              "radar_portfolio_ncm_setor",
              "https://arquivosradar.sefaz.rs.gov.br/RadarMercadoGaucho/Dados_Abertos/Portfolio_NCMs_Setor.csv",
              "radar/Portfolio_NCMs_Setor.csv",
              "csv",
          )

          # 4) Receita Dados — DFe Totais Município
          for year in YEARS:
              fn = f"DFe_Totais_Municipio_{year}.zip"
              url = f"https://receitadados.sefaz.rs.gov.br/Arquivos/{fn}"
              ok = fetch("dfe_totais_municipio", url, f"dfe/municipio/{fn}", "zip")
              availability[f"dfe_municipio_{year}"] = ok

          # 5) Receita Dados — DFe Totais CNAE Classe
          for year in YEARS:
              fn = f"DFe_Totais_CNAE_Classe_{year}.zip"
              url = f"https://receitadados.sefaz.rs.gov.br/Arquivos/{fn}"
              ok = fetch("dfe_totais_cnae_classe", url, f"dfe/cnae_classe/{fn}", "zip")
              availability[f"dfe_cnae_{year}"] = ok

          # 6) Cesta de Alimentos — mensal todas as regiões
          for year in YEARS:
              fn = f"public_dados_mensais_{year}.csv"
              url = f"https://arquivosradar.sefaz.rs.gov.br/CestaAlimentos/Mensal_Todas/{fn}"
              ok = fetch("cesta_alimentos_mensal", url, f"cesta_alimentos/{fn}", "csv")
              availability[f"cesta_{year}"] = ok

          # Manifest
          fields = [
              "kind","url","relative_path","status","available","bytes","sha256",
              "content_type","format","rows_approx","encoding","delimiter","header",
              "zip_members","note"
          ]
          with (OUT / "manifest.csv").open("w", newline="", encoding="utf-8") as f:
              w = csv.DictWriter(f, fieldnames=fields)
              w.writeheader()
              w.writerows(manifest)

          available = [r for r in manifest if r["available"]]
          by_kind = {}
          for r in available:
              by_kind.setdefault(r["kind"], []).append(r)

          summary = {
              "probe_years": YEARS,
              "probe_months": MONTHS,
              "available_files": len(available),
              "attempted_files": len(manifest),
              "available_by_kind": {k: len(v) for k, v in sorted(by_kind.items())},
              "available_paths_by_kind": {
                  k: [x["relative_path"] for x in v] for k, v in sorted(by_kind.items())
              },
              "notes": [
                  "Only HTTP 200 responses with plausible CSV/ZIP structure were saved.",
                  "Missing/future files remain recorded in manifest.csv and were not saved.",
                  "No transformation of source values was performed.",
              ],
          }
          (OUT / "summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          (OUT / "availability.json").write_text(
              json.dumps(availability, ensure_ascii=False, indent=2), encoding="utf-8"
          )

          print("SBMI_SERIES_DOWNLOAD_BEGIN")
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          print("SBMI_SERIES_DOWNLOAD_END")
          PY
          python /tmp/download_series.py

      - uses: actions/upload-artifact@v4
        with:
          name: sbmi-series-publicas-radar-dfe-cesta-v1
          path: artifacts/series_publicas/
          if-no-files-found: error
          retention-days: 30
