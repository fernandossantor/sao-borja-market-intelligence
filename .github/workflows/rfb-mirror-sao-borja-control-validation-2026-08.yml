name: rfb-mirror-sao-borja-control-validation-2026-08

on:
  push:
    branches:
      - explore/receita-estadual-rs-market-intel-v1
    paths:
      - ".github/workflows/rfb-mirror-sao-borja-control-validation-2026-08.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SNAPSHOT: "2026-08"
      MIRROR: "https://dados-abertos-rf-cnpj.casadosdados.com.br/arquivos/2026-08-09"
      SAO_BORJA_TOM: "8863"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: explore/receita-estadual-rs-market-intel-v1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser
        run: python -m pip install --quiet pandas

      - name: Reproduce São Borja official-control totals from mirror snapshot
        shell: bash
        run: |
          set -euo pipefail
          OUT="artifacts/rfb_mirror_sao_borja_control_validation_2026_08"
          mkdir -p "$OUT/raw"

          for i in {0..9}; do
            echo "download Estabelecimentos${i}.zip"
            curl -fL --retry 4 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 1800               "${MIRROR}/Estabelecimentos${i}.zip"               -o "$OUT/raw/Estabelecimentos${i}.zip"
            unzip -tq "$OUT/raw/Estabelecimentos${i}.zip"
          done

          python - <<'PY'
          import json,zipfile
          from collections import Counter,defaultdict
          from pathlib import Path
          import pandas as pd

          OUT=Path("artifacts/rfb_mirror_sao_borja_control_validation_2026_08")
          TOM="8863"

          local_active=[]
          branch_roots=set()

          # First pass: all active establishments in São Borja.
          for i in range(10):
              z=zipfile.ZipFile(OUT/"raw"/f"Estabelecimentos{i}.zip")
              name=next(n for n in z.namelist() if not n.endswith("/"))
              with z.open(name) as fh:
                  for ch in pd.read_csv(
                      fh,sep=";",header=None,dtype=str,encoding="latin1",
                      usecols=[0,1,2,3,5,11,19,20],
                      chunksize=400000,na_filter=False,low_memory=False
                  ):
                      # 3 = identificador matriz/filial; 5 = situação; 19 UF; 20 município TOM
                      m=(ch[5]=="02") & (ch[20]==TOM)
                      if not m.any(): continue
                      for row in ch.loc[m].itertuples(index=False,name=None):
                          basic,order,dv,mf,status,cnae,uf,mun=row
                          rec={"basic":basic,"order":order,"dv":dv,"mf":mf,"status":status,
                               "cnae":cnae,"uf":uf,"mun":mun}
                          local_active.append(rec)
                          if mf=="2": branch_roots.add(basic)

          # Second pass: find active matrices for every root with a São Borja branch.
          matrix_by_root={}
          if branch_roots:
              for i in range(10):
                  z=zipfile.ZipFile(OUT/"raw"/f"Estabelecimentos{i}.zip")
                  name=next(n for n in z.namelist() if not n.endswith("/"))
                  with z.open(name) as fh:
                      for ch in pd.read_csv(
                          fh,sep=";",header=None,dtype=str,encoding="latin1",
                          usecols=[0,1,2,3,5,19,20],
                          chunksize=400000,na_filter=False,low_memory=False
                      ):
                          m=ch[0].isin(branch_roots) & (ch[3]=="1") & (ch[5]=="02")
                          if not m.any(): continue
                          for row in ch.loc[m].itertuples(index=False,name=None):
                              basic,order,dv,mf,status,uf,mun=row
                              matrix_by_root[basic]={"uf":uf,"mun":mun,"cnpj":basic+order+dv}

          counts=Counter()
          unknown=[]
          for r in local_active:
              if r["mf"]=="1":
                  counts["MATRIZ_LOCAL"]+=1
              elif r["mf"]=="2":
                  mat=matrix_by_root.get(r["basic"])
                  if not mat:
                      counts["FILIAL_MATRIZ_NAO_LOCALIZADA"]+=1
                      unknown.append(r["basic"]+r["order"]+r["dv"])
                  elif mat["mun"]==TOM:
                      counts["FILIAL_DE_MATRIZ_LOCAL"]+=1
                  else:
                      counts["FILIAL_DE_MATRIZ_EXTERNA"]+=1
              else:
                  counts["INDETERMINADO"]+=1

          expected={
              "TOTAL_ATIVOS":7306,
              "MATRIZ_LOCAL":6906,
              "FILIAL_DE_MATRIZ_LOCAL":116,
              "FILIAL_DE_MATRIZ_EXTERNA":284,
              "FILIAL_MATRIZ_NAO_LOCALIZADA":0,
              "INDETERMINADO":0
          }
          observed={
              "TOTAL_ATIVOS":len(local_active),
              **{k:int(counts.get(k,0)) for k in expected if k!="TOTAL_ATIVOS"}
          }
          comparison={k:{
              "expected":expected[k],
              "observed":observed[k],
              "difference":observed[k]-expected[k],
              "match":observed[k]==expected[k]
          } for k in expected}
          report={
              "snapshot":"2026-08",
              "substantive_source":"Receita Federal do Brasil — Dados Abertos CNPJ",
              "transport":"Casa dos Dados mirror snapshot 2026-08-09",
              "territory":{"municipality":"São Borja","tom":"8863"},
              "canonical_reference":"caderno_base_territorial_v005_controle_cadastral_cnpj_20260906 / Controle_derivados",
              "expected":expected,
              "observed":observed,
              "comparison":comparison,
              "all_exact":all(x["match"] for x in comparison.values()),
              "branch_roots":len(branch_roots),
              "active_matrices_found_for_branch_roots":len(matrix_by_root),
              "unknown_branch_cnpjs":unknown[:100],
              "interpretation":"Exact structural reproduction strongly supports consistency of the mirror snapshot with the previously canonized 2026-08 municipal CNPJ control, but it is not a cryptographic hash reconciliation with the official RFB bytes."
          }
          (OUT/"validation.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if not report["all_exact"]:
              raise SystemExit("Mirror structural totals do not reconcile canonical control")
          PY

      - name: Persist validation
        if: success()
        shell: bash
        run: |
          DEST="docs/data_sources/rfb_mirror_sao_borja_control_validation_2026_08"
          mkdir -p "$DEST"
          cp artifacts/rfb_mirror_sao_borja_control_validation_2026_08/validation.json "$DEST/"
          cat > "$DEST/README.md" <<'EOF'
          # RFB 2026-08 — validação estrutural do espelho contra o controle municipal canonizado

          Camada de auditoria exploratória.

          O snapshot de transporte do espelho é reprocessado para todo o universo ativo
          de São Borja e comparado com os totais já canonizados no controle cadastral:
          total de estabelecimentos ativos, matrizes locais, filiais de matriz local,
          filiais de matriz externa e lacunas.

          Correspondência exata fortalece a consistência estrutural do espelho, mas
          NÃO substitui reconciliação criptográfica dos bytes com o host oficial RFB.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m "data: validate RFB mirror against canonical São Borja control"
            git pull --rebase origin explore/receita-estadual-rs-market-intel-v1
            git push origin HEAD:explore/receita-estadual-rs-market-intel-v1
          fi

      - name: Upload validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rfb-mirror-sao-borja-control-validation-2026-08
          retention-days: 30
          if-no-files-found: warn
          path: artifacts/rfb_mirror_sao_borja_control_validation_2026_08/validation.json
