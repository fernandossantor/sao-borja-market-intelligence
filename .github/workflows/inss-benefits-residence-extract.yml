name: inss-benefits-residence-extract

on:
  pull_request:
    paths:
      - ".github/workflows/inss-benefits-residence-extract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-sao-borja:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stream official July 2026 INSS resource and filter Sao Borja residence
        run: |
          set -euo pipefail
          python -m pip install --upgrade requests
          mkdir -p artifacts
          python - <<'PY'
          import csv
          import hashlib
          import io
          import json
          import re
          import unicodedata
          import zipfile
          from collections import Counter, defaultdict
          from decimal import Decimal, InvalidOperation
          from pathlib import Path
          import requests

          RESOURCE_ID = "63467992-f291-4549-8a07-b1d5ee27a1a2"
          API = f"https://dadosabertos.inss.gov.br/api/3/action/resource_show?id={RESOURCE_ID}"
          session = requests.Session()
          session.headers.update({"User-Agent": "SBMI INSS residence extraction/4.0"})

          meta_response = session.get(API, timeout=45)
          meta_response.raise_for_status()
          resource = meta_response.json()["result"]
          url = resource["url"]
          Path("artifacts/inss_resource_show_raw.json").write_bytes(meta_response.content)

          target = Path("/tmp/inss_emitidos_202607.zip")
          sha = hashlib.sha256()
          total_bytes = 0
          with session.get(url, stream=True, timeout=(30, 300)) as response:
              response.raise_for_status()
              download_headers = {
                  "status": response.status_code,
                  "content_type": response.headers.get("content-type"),
                  "content_length": response.headers.get("content-length"),
                  "etag": response.headers.get("etag"),
                  "last_modified": response.headers.get("last-modified"),
                  "accept_ranges": response.headers.get("accept-ranges"),
                  "final_url": response.url,
              }
              with target.open("wb") as out:
                  for chunk in response.iter_content(chunk_size=8 * 1024 * 1024):
                      if chunk:
                          out.write(chunk)
                          sha.update(chunk)
                          total_bytes += len(chunk)
          if download_headers["content_length"] and total_bytes != int(download_headers["content_length"]):
              raise SystemExit("National ZIP download size mismatch")

          download_manifest = {
              "dataset": "Benefícios emitidos - Plano de Dados Abertos Jun/2023 a jun/2027",
              "resource": resource.get("name"),
              "resource_id": RESOURCE_ID,
              "reference_period": "2026-07",
              "source_system": "SUIBE/INSS",
              "resource_url": url,
              "download_headers": download_headers,
              "downloaded_bytes": total_bytes,
              "download_sha256": sha.hexdigest(),
              "raw_national_file_persisted_in_artifact": False,
              "note": "O ZIP nacional é usado temporariamente no runner; o artifact preserva metadados, validação e o recorte municipal, não o arquivo nacional de ~1 GB.",
          }
          Path("artifacts/inss_202607_download_manifest.json").write_text(json.dumps(download_manifest, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(download_manifest, ensure_ascii=False, indent=2))

          def norm(value):
              value = unicodedata.normalize("NFKD", str(value))
              value = "".join(c for c in value if not unicodedata.combining(c))
              value = value.upper().strip()
              value = re.sub(r"[^A-Z0-9]+", " ", value)
              return re.sub(r"\s+", " ", value).strip()

          def parse_decimal(raw):
              text = str(raw).strip().replace("R$", "").replace(" ", "")
              if not text:
                  return None
              if "," in text and "." in text:
                  text = text.replace(".", "").replace(",", ".") if text.rfind(",") > text.rfind(".") else text.replace(",", "")
              elif "," in text:
                  text = text.replace(".", "").replace(",", ".")
              try:
                  return Decimal(text)
              except InvalidOperation:
                  return None

          with zipfile.ZipFile(target) as archive:
              members = archive.infolist()
              if len(members) != 1:
                  raise SystemExit(f"Expected one CSV member; found {len(members)}")
              member = members[0]
              layout = {
                  "member": member.filename,
                  "compressed_size": member.compress_size,
                  "uncompressed_size": member.file_size,
                  "crc": member.CRC,
              }
              Path("artifacts/inss_202607_zip_layout.json").write_text(json.dumps(layout, ensure_ascii=False, indent=2), encoding="utf-8")

              matched_rows = []
              total_rows = 0
              bad_width = 0
              borja_residence_literals = Counter()
              borja_payment_literals = Counter()
              type_summary = defaultdict(lambda: {"records": 0, "valid_credit": 0, "credit": Decimal("0")})
              total_credit = Decimal("0")
              valid_credit_records = 0

              with archive.open(member) as binary:
                  text = io.TextIOWrapper(binary, encoding="utf-8-sig", errors="strict", newline="")
                  reader = csv.reader(text, delimiter=",")
                  headers = next(reader)
                  normalized_headers = [norm(h) for h in headers]

                  def exact_col(label):
                      target_header = norm(label)
                      matches = [i for i, h in enumerate(normalized_headers) if h == target_header]
                      return matches[0] if matches else None

                  residence_idx = exact_col("municipio_residencia")
                  payment_idx = exact_col("municipio_pagamento")
                  value_idx = exact_col("credito")
                  type_idx = exact_col("tipo_beneficio")
                  client_idx = exact_col("clientela")
                  uf_idx = exact_col("uf")
                  species_indices = [i for i, h in enumerate(normalized_headers) if h == "ESPECIE"]
                  if residence_idx is None or value_idx is None:
                      raise SystemExit(f"Required source columns unavailable: {headers}")

                  keep_indices = []
                  for idx in [residence_idx, payment_idx, uf_idx, type_idx, client_idx, *species_indices, value_idx]:
                      if idx is not None and idx not in keep_indices:
                          keep_indices.append(idx)

                  for row in reader:
                      total_rows += 1
                      if len(row) != len(headers):
                          bad_width += 1
                          continue
                      residence_literal = row[residence_idx]
                      residence_upper = residence_literal.upper()
                      if "BORJA" not in residence_upper:
                          continue
                      residence_normalized = norm(residence_literal)
                      borja_residence_literals[residence_literal] += 1
                      if "SAO BORJA" not in residence_normalized:
                          continue
                      if payment_idx is not None:
                          borja_payment_literals[row[payment_idx]] += 1
                      value = parse_decimal(row[value_idx])
                      matched_rows.append(row)
                      type_key = row[type_idx] if type_idx is not None else "[não identificado]"
                      type_summary[type_key]["records"] += 1
                      if value is not None:
                          valid_credit_records += 1
                          total_credit += value
                          type_summary[type_key]["valid_credit"] += 1
                          type_summary[type_key]["credit"] += value

              diagnostic = {
                  "source_header_columns": headers,
                  "source_encoding": "utf-8-sig",
                  "delimiter": ",",
                  "national_data_rows_read": total_rows,
                  "bad_width_rows": bad_width,
                  "matched_residence_records": len(matched_rows),
                  "residence_literals_containing_borja": borja_residence_literals,
                  "payment_literals_for_matched_residence": borja_payment_literals,
                  "filter_rule": "municipio_residencia literal contains BORJA and normalized value contains SAO BORJA",
                  "source_value_field_literal": headers[value_idx],
                  "source_value_semantics": "O portal descreve o conjunto como contendo valor líquido; o CSV de 2026-07 usa o cabeçalho literal credito.",
                  "duplicate_especie_headers": len(species_indices),
              }
              Path("artifacts/inss_emitidos_sao_borja_202607_diagnostic_v004.json").write_text(json.dumps(diagnostic, ensure_ascii=False, indent=2), encoding="utf-8")
              print(json.dumps(diagnostic, ensure_ascii=False, indent=2))

              if not matched_rows:
                  Path("artifacts/inss_emitidos_sao_borja_202607_status_v004.json").write_text(json.dumps({"status":"no_residence_match","reference_period":"2026-07"}, indent=2), encoding="utf-8")
                  raise SystemExit(0)

              filtered = Path("artifacts/inss_emitidos_sao_borja_residencia_202607_v004.csv")
              output_headers = []
              seen = Counter()
              for idx in keep_indices:
                  seen[headers[idx]] += 1
                  output_headers.append(headers[idx] if headers.count(headers[idx]) == 1 else f"{headers[idx]}_{seen[headers[idx]]}")
              with filtered.open("w", encoding="utf-8", newline="") as out:
                  writer = csv.writer(out)
                  writer.writerow(output_headers + ["periodo_referencia", "natureza"])
                  for row in matched_rows:
                      writer.writerow([row[i] for i in keep_indices] + ["2026-07", "observado_em_fonte_oficial"])

              with Path("artifacts/inss_emitidos_sao_borja_202607_por_tipo_v004.csv").open("w", encoding="utf-8", newline="") as out:
                  writer = csv.writer(out)
                  writer.writerow(["tipo_beneficio_fonte", "registros_emitidos", "registros_credito_valido", "soma_credito_rs", "periodo", "natureza"])
                  for key, stats in sorted(type_summary.items(), key=lambda item: (-item[1]["credit"], item[0])):
                      writer.writerow([key, stats["records"], stats["valid_credit"], f"{stats['credit']:.2f}", "2026-07", "calculado_a_partir_de_registros_oficiais"])

              validation = {
                  "reference_period": "2026-07",
                  "source": "INSS Portal de Dados Abertos / SUIBE — Benefícios Emitidos Julho 2026",
                  "geographic_filter_source_field": headers[residence_idx],
                  "matched_records": len(matched_rows),
                  "valid_credit_records": valid_credit_records,
                  "sum_credit_rs": f"{total_credit:.2f}",
                  "unique_residence_literals": sorted(borja_residence_literals),
                  "type_categories_literal": sorted(type_summary),
                  "filtered_csv_sha256": hashlib.sha256(filtered.read_bytes()).hexdigest(),
                  "interpretation_limit": "A contagem é de registros de benefícios/créditos emitidos; não equivale a pessoas beneficiárias únicas sem identificador de beneficiário.",
                  "annualization_limit": "Não multiplicar automaticamente o valor mensal por 12; competências podem variar e incluir eventos próprios.",
              }
              Path("artifacts/inss_emitidos_sao_borja_202607_validation_v004.json").write_text(json.dumps(validation, ensure_ascii=False, indent=2), encoding="utf-8")
              print(json.dumps(validation, ensure_ascii=False, indent=2))

          target.unlink(missing_ok=True)
          PY

      - name: Upload Sao Borja INSS extraction artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inss-emitidos-sao-borja-residencia-202607-v004
          if-no-files-found: warn
          retention-days: 30
          path: artifacts/
