name: quality

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Lint stabilized package
        run: python -m ruff check src/sbmi tests

      - name: Test
        run: python -m pytest

  rfb-cnpj-territorial-control:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/cnpj-territorial-control-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      COMPETENCE: '2026-08'
      RFB_SHARE: 'https://arquivos.receitafederal.gov.br/index.php/s/gn672Ad4CF8N6TK/download'
      RFB_CNPJ_PATH: '%2FDados%2FCadastros%2FCNPJ%2F2026-08'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Download authorized official RFB CNPJ files
        shell: bash
        run: |
          set -euo pipefail
          raw=".data/raw/rfb_cnpj/${COMPETENCE}"
          mkdir -p "$raw"
          echo 'Disk before download:'
          df -h .
          download_file() {
            local file="$1"
            local out="$raw/$file"
            echo "Downloading $file"
            curl --fail --location --retry 5 --retry-delay 5 --connect-timeout 30 \
              --output "$out" \
              "${RFB_SHARE}?path=${RFB_CNPJ_PATH}&files=${file}"
            test -s "$out"
            unzip -tq "$out" >/dev/null
            du -h "$out"
          }
          download_file Municipios.zip
          for i in {0..9}; do download_file "Estabelecimentos${i}.zip"; done
          for i in {0..9}; do download_file "Empresas${i}.zip"; done
          echo 'Disk after download:'
          df -h .
          du -sh "$raw"
          sha256sum "$raw"/*.zip > "$raw/SHA256SUMS.txt"

      - name: Build São Borja territorial-control base
        shell: bash
        run: |
          set -euo pipefail
          EXECUTION_ID="cnpj-territorial-control-${COMPETENCE}-$(date -u +%Y%m%d-%H%M%S)"
          echo "EXECUTION_ID=$EXECUTION_ID" >> "$GITHUB_ENV"
          python -m sbmi.cnpj_territorial_control_cli \
            --establishments-dir ".data/raw/rfb_cnpj/${COMPETENCE}" \
            --companies-dir ".data/raw/rfb_cnpj/${COMPETENCE}" \
            --municipalities-zip ".data/raw/rfb_cnpj/${COMPETENCE}/Municipios.zip" \
            --execution-id "$EXECUTION_ID" \
            --municipality-tom 8863 \
            --municipality-ibge 4318002 \
            --active-status-code 02 \
            --chunksize 200000

      - name: Inspect compact outputs
        shell: bash
        run: |
          set -euo pipefail
          echo '--- validation.csv ---'
          cat ".data/audit/base_territorial/cnpj_territorial_control/${EXECUTION_ID}/validation.csv"
          echo '--- by CNAE division ---'
          cat ".data/exports/base_territorial/cnpj_territorial_control/${EXECUTION_ID}/cnpj_territorial_control_by_cnae_division.csv"
          echo '--- by size ---'
          cat ".data/exports/base_territorial/cnpj_territorial_control/${EXECUTION_ID}/cnpj_territorial_control_by_size.csv"

      - name: Upload compact analytical outputs
        uses: actions/upload-artifact@v4
        with:
          name: cnpj-territorial-control-2026-08
          if-no-files-found: error
          retention-days: 30
          path: |
            .data/curated/base_territorial/cnpj_territorial_control/${{ env.EXECUTION_ID }}/
            .data/exports/base_territorial/cnpj_territorial_control/${{ env.EXECUTION_ID }}/
            .data/audit/base_territorial/cnpj_territorial_control/${{ env.EXECUTION_ID }}/
            .data/raw/rfb_cnpj/${{ env.COMPETENCE }}/SHA256SUMS.txt
