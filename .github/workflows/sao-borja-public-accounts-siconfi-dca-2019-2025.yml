name: sao-borja-public-accounts-siconfi-dca-2019-2025

on:
  push:
    branches:
      - explore/receita-estadual-rs-market-intel-v1
    paths:
      - ".github/workflows/sao-borja-public-accounts-siconfi-dca-2019-2025.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: explore/receita-estadual-rs-market-intel-v1

      - name: Extract official DCA annexes for São Borja
        shell: bash
        run: |
          set -euo pipefail
          OUT="artifacts/sao_borja_public_accounts_siconfi_dca_2019_2025"
          mkdir -p "$OUT/raw"

          python - <<'PY'
          import csv
          import json
          import re
          import unicodedata
          from pathlib import Path

          import requests

          OUT = Path("artifacts/sao_borja_public_accounts_siconfi_dca_2019_2025")
          BASE = "https://apidatalake.tesouro.gov.br/ords/siconfi/tt/dca"
          IBGE = "4318002"
          YEARS = list(range(2019, 2026))
          ANNEXES = ["DCA-Anexo I-C", "DCA-Anexo I-D", "DCA-Anexo I-E"]

          session = requests.Session()
          session.headers.update(
              {
                  "User-Agent": "SBMI territorial market intelligence audit/1.0",
                  "Accept": "application/json",
              }
          )

          def norm(value):
              text = unicodedata.normalize("NFKD", str(value or ""))
              text = "".join(ch for ch in text if not unicodedata.combining(ch))
              return re.sub(r"\s+", " ", text.upper()).strip()

          def fetch_annex(year, annex):
              rows = []
              offset = 0
              limit = 5000
              page_meta = []
              while True:
                  resp = session.get(
                      BASE,
                      params={
                          "an_exercicio": year,
                          "no_anexo": annex,
                          "id_ente": IBGE,
                          "limit": limit,
                          "offset": offset,
                      },
                      timeout=120,
                  )
                  meta = {
                      "year": year,
                      "annex": annex,
                      "offset": offset,
                      "http_status": resp.status_code,
                      "content_type": resp.headers.get("content-type", ""),
                      "bytes": len(resp.content),
                      "request_url": resp.url,
                  }
                  resp.raise_for_status()
                  payload = resp.json()
                  items = payload.get("items", [])
                  if not isinstance(items, list):
                      raise RuntimeError(f"Unexpected SICONFI payload for {year} {annex}")
                  rows.extend(items)
                  meta["items"] = len(items)
                  meta["has_more"] = bool(payload.get("hasMore", False))
                  page_meta.append(meta)
                  if not payload.get("hasMore", False) or not items:
                      break
                  offset += len(items)
                  if offset > 100000:
                      raise RuntimeError("pagination guard")
              return rows, page_meta

          all_rows = []
          coverage = []
          raw_manifest = []
          for year in YEARS:
              for annex in ANNEXES:
                  rows, pages = fetch_annex(year, annex)
                  for row in rows:
                      enriched = {"_exercise": year, "_annex_requested": annex, **row}
                      all_rows.append(enriched)
                  raw_path = OUT / "raw" / f"dca_{year}_{annex[-3:].replace(' ', '_')}.json"
                  raw_path.write_text(
                      json.dumps(
                          {
                              "source": BASE,
                              "territory": {"municipality": "São Borja", "ibge": IBGE},
                              "exercise": year,
                              "annex_requested": annex,
                              "items": rows,
                              "pages": pages,
                          },
                          ensure_ascii=False,
                          indent=2,
                      ),
                      encoding="utf-8",
                  )
                  raw_manifest.append(
                      {
                          "year": year,
                          "annex": annex,
                          "file": raw_path.name,
                          "rows": len(rows),
                          "source_endpoint": BASE,
                      }
                  )
                  coverage.append(
                      {
                          "year": year,
                          "annex": annex,
                          "rows": len(rows),
                          "pages": len(pages),
                          "status": "OK",
                      }
                  )
                  print(year, annex, len(rows))

          # Preserve the complete schema without assuming that field labels are invariant
          # over time. This first layer is an auditable inventory, not yet a reconciled series.
          fields = sorted({key for row in all_rows for key in row.keys()})
          with (OUT / "dca_rows_2019_2025.csv").open(
              "w", newline="", encoding="utf-8-sig"
          ) as fh:
              writer = csv.DictWriter(fh, fieldnames=fields)
              writer.writeheader()
              writer.writerows(all_rows)

          with (OUT / "coverage.csv").open("w", newline="", encoding="utf-8-sig") as fh:
              writer = csv.DictWriter(
                  fh, fieldnames=["year", "annex", "rows", "pages", "status"]
              )
              writer.writeheader()
              writer.writerows(coverage)

          # Keyword inventory: candidates only. No row is silently relabelled into an
          # economic concept before the official account label/column is inspected.
          terms = (
              "RECEITA CORRENTE",
              "TRANSFERENCIAS CORRENTES",
              "FPM",
              "FUNDO DE PARTICIPACAO DOS MUNICIPIOS",
              "ICMS",
              "FUNDEB",
              "IPVA",
              "ITR",
              "PESSOAL",
              "PREVID",
              "JUROS",
              "DIVIDA",
              "INVESTIMENT",
              "DESPESA",
          )
          candidate_rows = []
          for row in all_rows:
              haystack = " | ".join(norm(v) for v in row.values())
              matched = sorted({term for term in terms if term in haystack})
              if matched:
                  candidate_rows.append({**row, "_keyword_hits": "|".join(matched)})

          candidate_fields = sorted(
              {key for row in candidate_rows for key in row.keys()}
          )
          with (OUT / "candidate_series_rows.csv").open(
              "w", newline="", encoding="utf-8-sig"
          ) as fh:
              writer = csv.DictWriter(fh, fieldnames=candidate_fields)
              writer.writeheader()
              writer.writerows(candidate_rows)

          # Compact dictionaries make temporal label/column changes visible before any
          # calculation is made.
          dictionary_keys = [
              key
              for key in fields
              if any(
                  token in key.lower()
                  for token in ("conta", "cod", "coluna", "anexo", "rotulo", "exercicio")
              )
          ]
          dictionary = []
          seen = set()
          for row in all_rows:
              rec = {"_exercise": row.get("_exercise"), "_annex_requested": row.get("_annex_requested")}
              for key in dictionary_keys:
                  rec[key] = row.get(key, "")
              marker = tuple(str(rec.get(k, "")) for k in sorted(rec))
              if marker not in seen:
                  seen.add(marker)
                  dictionary.append(rec)

          dict_fields = sorted({key for row in dictionary for key in row.keys()})
          with (OUT / "dca_dictionary_2019_2025.csv").open(
              "w", newline="", encoding="utf-8-sig"
          ) as fh:
              writer = csv.DictWriter(fh, fieldnames=dict_fields)
              writer.writeheader()
              writer.writerows(dictionary)

          (OUT / "source_manifest.json").write_text(
              json.dumps(
                  {
                      "source": "Tesouro Nacional — SICONFI / API de Dados Abertos",
                      "endpoint": BASE,
                      "territory": {"municipality": "São Borja/RS", "ibge": IBGE},
                      "reference_period": "2019-2025 annual DCA",
                      "unit": (
                          "Preserve the unit/column semantics exactly as returned by "
                          "SICONFI; do not infer unit from labels in this raw layer."
                      ),
                      "annexes": ANNEXES,
                      "raw_files": raw_manifest,
                      "nature": "observed official administrative data",
                      "limitations": [
                          "DCA is annual; 2026 is not included as a closed DCA exercise.",
                          "Account names and columns must be reconciled across exercises before constructing a final time series.",
                          "Candidate keyword rows are an audit aid, not a semantic classification.",
                      ],
                  },
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )
          PY

      - name: Persist SICONFI DCA evidence
        shell: bash
        run: |
          set -euo pipefail
          DEST="docs/data_sources/sao_borja_public_accounts_siconfi_dca_2019_2025"
          mkdir -p "$DEST"
          cp artifacts/sao_borja_public_accounts_siconfi_dca_2019_2025/coverage.csv "$DEST/"
          cp artifacts/sao_borja_public_accounts_siconfi_dca_2019_2025/dca_rows_2019_2025.csv "$DEST/"
          cp artifacts/sao_borja_public_accounts_siconfi_dca_2019_2025/candidate_series_rows.csv "$DEST/"
          cp artifacts/sao_borja_public_accounts_siconfi_dca_2019_2025/dca_dictionary_2019_2025.csv "$DEST/"
          cp artifacts/sao_borja_public_accounts_siconfi_dca_2019_2025/source_manifest.json "$DEST/"

          cat > "$DEST/README.md" <<'EOF'
          # São Borja — SICONFI/DCA — contas públicas 2019–2025

          **Fonte:** Tesouro Nacional — SICONFI, API de Dados Abertos.
          **Abrangência:** município de São Borja/RS, código IBGE 4318002.
          **Período:** exercícios anuais de 2019 a 2025.
          **Anexos coletados:** DCA Anexo I-C (receitas orçamentárias), I-D (despesas
          por natureza) e I-E (despesas por função).

          Esta camada preserva as linhas observadas e um dicionário temporal antes da
          construção da série reconciliada. O arquivo `candidate_series_rows.csv` é
          apenas uma triagem por palavras-chave; ele não redefine as contas oficiais.

          2026 não é tratado como DCA anual fechada. A execução corrente permanece em
          camada separada (Portal PMSB/RREO quando metodologicamente comparável).

          Próximo passo: reconciliar contas e colunas por exercício e então calcular,
          com fórmulas explícitas, receita corrente, transferências correntes,
          FPM/ICMS/Fundeb/IPVA/ITR, empenhado/liquidado/pago, pessoal/previdência,
          juros/dívida e investimentos.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m "data: collect SICONFI DCA public accounts 2019 2025"
            git pull --rebase origin explore/receita-estadual-rs-market-intel-v1
            git push origin HEAD:explore/receita-estadual-rs-market-intel-v1
          fi

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sao-borja-public-accounts-siconfi-dca-2019-2025
          retention-days: 30
          if-no-files-found: warn
          path: artifacts/sao_borja_public_accounts_siconfi_dca_2019_2025/
