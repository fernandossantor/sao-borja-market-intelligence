name: receita-radar-mercado-schema-discovery-v1

on:
  push:
    branches: [feature/cnpj-territorial-control-v1]
    paths: [".github/workflows/receita-radar-mercado-schema-discovery-v1.yml"]
  pull_request:
    branches: [main]
    paths: [".github/workflows/receita-radar-mercado-schema-discovery-v1.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright requests beautifulsoup4
          python -m playwright install --with-deps chromium >/dev/null
      - name: Inspect public Radar do Mercado PowerBI
        run: |
          set -euo pipefail
          mkdir -p artifacts/receita_radar_mercado_schema
          cat > /tmp/discover.py <<'PY'
          import asyncio,json,re
          from pathlib import Path
          from urllib.parse import urljoin,urlsplit,urlunsplit
          import requests
          from bs4 import BeautifulSoup
          from playwright.async_api import async_playwright

          OUT=Path("artifacts/receita_radar_mercado_schema")
          PAGE="https://receitadados.sefaz.rs.gov.br/desenvolve-rs/radar-do-mercado-da-receita-estadual/"

          def scrub(s):
            if not s:return s
            s=re.sub(r'Bearer\s+[A-Za-z0-9._~+/=-]+','Bearer <REDACTED>',s,flags=re.I)
            s=re.sub(r'("?(?:accessToken|token|embedToken)"?\s*[:=]\s*")[^"]+(")',r'\1<REDACTED>\2',s,flags=re.I)
            return s
          def safeurl(u):
            p=urlsplit(u)
            if "app.powerbi.com/view" in u:return u
            return urlunsplit((p.scheme,p.netloc,p.path,"",""))

          html=requests.get(PAGE,timeout=60,headers={"User-Agent":"SBMI Radar Mercado audit/1.0"}).text
          soup=BeautifulSoup(html,"html.parser")
          iframes=[urljoin(PAGE,x.get("src")) for x in soup.find_all("iframe") if x.get("src") and "powerbi.com" in x.get("src")]
          if not iframes: raise RuntimeError("No PowerBI iframe found")

          async def inspect(browser,url):
            page=await browser.new_page(viewport={"width":1600,"height":1000})
            recs=[]
            async def handle(resp):
              low=resp.url.lower()
              if not any(k in low for k in ("modelsandexploration","querydata","metadata","conceptualschema","explore")):return
              rec={"url":safeurl(resp.url),"status":resp.status,"content_type":resp.headers.get("content-type")}
              try:
                body=await resp.text(); rec["body_head"]=scrub(body[:900000]); rec["body_len"]=len(body)
              except Exception as exc: rec["error"]=repr(exc)
              recs.append(rec)
            page.on("response",handle)
            err=None; txt=""
            try:
              await page.goto(url,wait_until="domcontentloaded",timeout=120000)
              await page.wait_for_timeout(20000)
              txt=await page.locator("body").inner_text(timeout=10000)
            except Exception as exc:err=repr(exc)
            await page.close()
            blob="\n".join(r.get("body_head","") for r in recs)
            terms={}
            for term in ("municipio","município","cnae","ncm","faturamento","valor","mercado","venda","empresa","contribuinte","corede","setor","atividade","produto","participacao","participação"):
              terms[term]=len(re.findall(re.escape(term),blob,flags=re.I))
            # Collect entity/property schema snippets around likely business terms.
            snippets=[]
            for pat in [r'.{0,220}(?:municipio|município|cnae|ncm|faturamento|mercado|venda|empresa|contribuinte|corede|setor|produto|participa.{0,3}).{0,420}']:
              for m in re.finditer(pat,blob,flags=re.I|re.S):
                sn=re.sub(r'\s+',' ',scrub(m.group(0)))[:900]
                if sn not in snippets: snippets.append(sn)
                if len(snippets)>=150:break
            # Try to parse conceptual schema entity names / properties from JSON bodies.
            entities=[]
            for r in recs:
              body=r.get("body_head","")
              try: js=json.loads(body)
              except: continue
              def walk(x):
                if isinstance(x,dict):
                  if "Entities" in x and isinstance(x["Entities"],list):
                    for ent in x["Entities"]:
                      if isinstance(ent,dict):
                        entities.append({"Name":ent.get("Name"),"Properties":[p.get("Name") for p in ent.get("Properties",[]) if isinstance(p,dict)]})
                  for v in x.values(): walk(v)
                elif isinstance(x,list):
                  for v in x:walk(v)
              walk(js)
            # de-dup
            uniq=[];seen=set()
            for e in entities:
              key=(e.get("Name"),tuple(e.get("Properties") or []))
              if key not in seen:seen.add(key);uniq.append(e)
            return {"url":url,"error":err,"body_text_head":scrub(txt[:70000]),"network":recs,"terms":terms,"entities":uniq,"snippets":snippets}

          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True)
              results=[await inspect(b,u) for u in iframes]
              await b.close()
            compact=[{"iframe":i,"url":r["url"],"error":r["error"],"terms":r["terms"],"entities":r["entities"],"body_text_head":r["body_text_head"][:15000],"snippets":r["snippets"][:40]} for i,r in enumerate(results)]
            out={"source_page":PAGE,"iframe_count":len(iframes),"results":results,"privacy":"No headers/cookies/tokens persisted; token-like strings redacted."}
            (OUT/"discovery.json").write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
            print("SBMI_RADAR_MERCADO_SCHEMA_BEGIN")
            print(json.dumps(compact,ensure_ascii=False,indent=2)[:180000])
            print("SBMI_RADAR_MERCADO_SCHEMA_END")
          asyncio.run(main())
          PY
          python /tmp/discover.py
      - uses: actions/upload-artifact@v4
        with:
          name: receita-radar-mercado-schema-discovery-v1
          path: artifacts/receita_radar_mercado_schema/
          if-no-files-found: error
          retention-days: 30
