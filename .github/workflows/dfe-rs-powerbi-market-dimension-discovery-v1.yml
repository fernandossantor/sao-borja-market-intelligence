name: dfe-rs-powerbi-market-dimension-discovery-v1

on:
  push:
    branches:
      - feature/cnpj-territorial-control-v1
    paths:
      - ".github/workflows/dfe-rs-powerbi-market-dimension-discovery-v1.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/dfe-rs-powerbi-market-dimension-discovery-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser dependencies
        run: |
          python -m pip install --quiet requests playwright
          python -m playwright install --with-deps chromium >/dev/null

      - name: Inspect public Receita Dados DFe panel for municipality-sector dimensions
        run: |
          set -euo pipefail
          mkdir -p artifacts/dfe_rs_powerbi_discovery
          cat > /tmp/discover.py <<'PY'
          from __future__ import annotations
          import asyncio, json, re
          from pathlib import Path
          from urllib.parse import urljoin, urlsplit, urlunsplit

          import requests
          from playwright.async_api import async_playwright

          OUT=Path("artifacts/dfe_rs_powerbi_discovery")
          PAGE="https://receitadados.sefaz.rs.gov.br/paineis/documentos-eletronicos/"
          UA="Mozilla/5.0 SBMI DFe market dimension public audit/1.0"

          def strip_query(url):
              try:
                  p=urlsplit(url)
                  return urlunsplit((p.scheme,p.netloc,p.path,"",""))
              except Exception:
                  return url

          def redact(text):
              if not isinstance(text,str): return text
              text=re.sub(r'Bearer\s+[A-Za-z0-9._~+/=-]+','Bearer <REDACTED>',text,flags=re.I)
              text=re.sub(r'("?(?:accessToken|embedToken|token|resolvedClusterUrl)"?\s*[:=]\s*")[^"]+(")',r'\1<REDACTED>\2',text,flags=re.I)
              text=re.sub(r'([?&](?:access_token|token|embedToken)=)[^&\s"]+',r'\1<REDACTED>',text,flags=re.I)
              return text

          # Static inspection.
          s=requests.Session(); s.headers.update({"User-Agent":UA})
          r=s.get(PAGE,timeout=90); r.raise_for_status()
          html=r.text
          (OUT/"page.html").write_text(html,encoding="utf-8")
          links=sorted(set(urljoin(PAGE,x) for x in re.findall(r'(?:href|src)=["\']([^"\']+)["\']',html,re.I)))
          static={
              "status":r.status_code,
              "content_type":r.headers.get("content-type"),
              "links":[u for u in links if any(k in u.lower() for k in ("powerbi","app.powerbi","report","document","dfe","arquivo","csv","zip"))],
              "powerbi_fragments":re.findall(r'.{0,300}(?:powerbi|app\.powerbi|reportId|workspaceId|embed).{0,500}',html,re.I|re.S)[:100],
          }
          (OUT/"static.json").write_text(json.dumps(static,ensure_ascii=False,indent=2),encoding="utf-8")

          async def main():
              network=[]
              frames=[]
              body_texts=[]
              console=[]
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True)
                  context=await browser.new_context(viewport={"width":1600,"height":1100},user_agent=UA)
                  page=await context.new_page()

                  page.on("console", lambda msg: console.append({"type":msg.type,"text":redact(msg.text)[:4000]}))

                  async def handle(resp):
                      u=resp.url
                      low=u.lower()
                      if not any(k in low for k in ("querydata","modelsandexploration","metadata","explore","powerbi","report","conceptualschema","visuals")):
                          return
                      rec={"url":strip_query(u),"status":resp.status,"content_type":resp.headers.get("content-type")}
                      try:
                          ct=(resp.headers.get("content-type") or "").lower()
                          if any(x in ct for x in ("json","text","javascript")):
                              text=redact(await resp.text())
                              # Retain only bounded public metadata/query shapes.
                              rec["body_head"]=text[:180000]
                              rec["body_len"]=len(text)
                              rec["keyword_counts"]={k:text.lower().count(k) for k in (
                                  "municipio","município","cnae","ncm","modelo_dfe","nf-e","nfc-e","valor","quantidade","cod_municipio"
                              )}
                      except Exception as exc:
                          rec["body_error"]=repr(exc)
                      network.append(rec)

                  page.on("response",handle)
                  await page.goto(PAGE,wait_until="domcontentloaded",timeout=120000)
                  await page.wait_for_timeout(35000)

                  frames=[{"url":strip_query(fr.url),"name":fr.name} for fr in page.frames]
                  for fr in page.frames:
                      try:
                          txt=await fr.locator("body").inner_text(timeout=5000)
                          if txt:
                              body_texts.append({"frame":strip_query(fr.url),"text":txt[:80000]})
                      except Exception:
                          pass

                  # Capture page HTML after embeds initialize.
                  try:
                      (OUT/"rendered.html").write_text(await page.content(),encoding="utf-8")
                  except Exception:
                      pass
                  await browser.close()

              # Score responses by relevant dimensional terms.
              for rec in network:
                  counts=rec.get("keyword_counts",{})
                  rec["market_dimension_score"]=sum(counts.values())
              network.sort(key=lambda x:(-x.get("market_dimension_score",0),x.get("url","")))
              result={
                  "page":PAGE,
                  "frames":frames,
                  "network_count":len(network),
                  "network":network[:150],
                  "body_texts":body_texts,
                  "console":console[:100],
                  "privacy":"No request headers, cookies or embed/access tokens are persisted; URLs are query-stripped and text bodies token-redacted.",
                  "question":"Does the public semantic model expose municipality and CNAE/NCM within one queryable model, allowing São Borja × sector/product without proxy allocation?",
              }
              (OUT/"discovery.json").write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding="utf-8")
              print("SBMI_DFE_PBI_DISCOVERY_BEGIN")
              print(json.dumps({
                  "static":static,
                  "frames":frames,
                  "network_count":len(network),
                  "top":[
                      {"url":x.get("url"),"status":x.get("status"),"content_type":x.get("content_type"),"score":x.get("market_dimension_score"),"keyword_counts":x.get("keyword_counts"),"body_head":(x.get("body_head") or "")[:25000]}
                      for x in network[:25]
                  ],
                  "body_texts":body_texts[:20],
              },ensure_ascii=False,indent=2))
              print("SBMI_DFE_PBI_DISCOVERY_END")

          asyncio.run(main())
          PY
          python /tmp/discover.py

      - uses: actions/upload-artifact@v4
        with:
          name: dfe-rs-powerbi-market-dimension-discovery-v1
          path: artifacts/dfe_rs_powerbi_discovery/
          if-no-files-found: error
          retention-days: 30
