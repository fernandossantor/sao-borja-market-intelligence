name: cnj-remuneracao-qlik-chromium-audit

on:
  push:
    branches:
      - feature/cnpj-territorial-control-v1
    paths:
      - ".github/workflows/cnj-remuneracao-qlik-chromium-audit.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/cnj-remuneracao-qlik-chromium-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Render official CNJ Qlik panel with Chromium
        run: |
          set -euo pipefail
          OUT=artifacts/cnj_remuneracao_qlik_chromium_audit
          mkdir -p "$OUT"
          URL='https://paineisanalytics.cnj.jus.br/single/?appid=8ccb93ca-848f-4ffe-bf9b-96d57878c4d7&sheet=a710d8e5-fddb-4fa7-9098-4dbca30a391a&lang=pt-BR&theme=Mix_Theme&opt=ctxmenu,currsel'
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          {
            echo "chrome=$CHROME"
            echo "url=$URL"
          } | tee "$OUT/runtime.txt"
          if [ -z "$CHROME" ]; then
            echo "NO_CHROME" | tee "$OUT/status.txt"
            exit 0
          fi
          set +e
          timeout 70s "$CHROME"             --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage             --window-size=1800,1400 --virtual-time-budget=40000             --dump-dom "$URL" > /tmp/cnj_qlik_dom.html 2> /tmp/cnj_qlik_chrome.err
          RC=$?
          set -e
          echo "chrome_rc=$RC" | tee "$OUT/status.txt"
          echo "dom_bytes=$(wc -c < /tmp/cnj_qlik_dom.html 2>/dev/null || echo 0)" | tee -a "$OUT/status.txt"
          echo "stderr_bytes=$(wc -c < /tmp/cnj_qlik_chrome.err 2>/dev/null || echo 0)" | tee -a "$OUT/status.txt"
          python - <<'PY'
          import html, json, re
          from pathlib import Path
          out=Path("artifacts/cnj_remuneracao_qlik_chromium_audit")
          p=Path("/tmp/cnj_qlik_dom.html")
          raw=p.read_text(encoding="utf-8",errors="ignore") if p.exists() else ""
          # Extract text nodes only, normalize, retain structural/filter labels and no monetary/person rows.
          texts=[]
          for x in re.findall(r'>([^<>]{1,300})<',raw,re.S):
            t=html.unescape(re.sub(r'\s+',' ',x)).strip()
            if t: texts.append(t)
          keys=("lotação","lotacao","tribunal","órgão","orgao","ano","mês","mes","competência","competencia",
                "cargo","nome","remuneração","remuneracao","subsídio","subsidio","indenização","indenizacao",
                "vantagem","desconto","líquido","liquido","bruto","total","folha","magistrado","referência","referencia")
          keep=[]
          for t in texts:
            low=t.lower()
            if any(k in low for k in keys):
              if "r$" in low or re.search(r'\b\d{1,3}(?:\.\d{3})+,\d{2}\b',t):
                continue
              if len(t)<=220:
                keep.append(t)
          # Also capture HTML attribute names/classes that show Qlik controls but no values.
          qlik_tokens=sorted(set(re.findall(r'\b(?:qv-[a-z0-9_-]+|q-listbox|qv-object|qlik-[a-z0-9_-]+)\b',raw,re.I)))
          res={
            "dom_bytes":len(raw.encode("utf-8")),
            "text_node_count":len(texts),
            "structural_text":list(dict.fromkeys(keep))[:250],
            "qlik_tokens":qlik_tokens[:250],
            "has_sao_borja_text":bool(re.search(r's[aã]o\s+borja',raw,re.I)),
            "has_lotacao_text":bool(re.search(r'lota(?:ç|c)[aã]o|lotacao',raw,re.I)),
            "has_tribunal_text":bool(re.search(r'tribunal',raw,re.I))
          }
          (out/"render_summary.json").write_text(json.dumps(res,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(res,ensure_ascii=False,indent=2))
          PY
          rm -f /tmp/cnj_qlik_dom.html /tmp/cnj_qlik_chrome.err
      - uses: actions/upload-artifact@v4
        with:
          name: cnj-remuneracao-qlik-chromium-audit
          retention-days: 30
          if-no-files-found: error
          path: artifacts/cnj_remuneracao_qlik_chromium_audit/
