name: licitacon-qonws-discovery

on:
  push:
    branches: [explore/receita-estadual-rs-market-intel-v1]
    paths: [".github/workflows/licitacon-qonws-discovery.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: explore/receita-estadual-rs-market-intel-v1

      - name: Probe portal and Swagger
        shell: bash
        run: |
          set -euo pipefail
          OUT=artifacts/licitacon_qonws_discovery
          mkdir -p "$OUT"
          printf 'url\thttp_code\tcontent_type\tbytes\n' > "$OUT/probe.tsv"
          urls=(
            'https://portal.tce.rs.gov.br/'
            'https://portal.tce.rs.gov.br/api/qonws/swagger-ui/index.html'
            'https://portal.tce.rs.gov.br/api/qonws/v2/api-docs'
            'https://portal.tce.rs.gov.br/api/qonws/v3/api-docs'
            'https://portal.tce.rs.gov.br/api/qonws/swagger-resources'
            'https://portal.tce.rs.gov.br/api/qonws/swagger-resources/configuration/ui'
            'https://portal.tce.rs.gov.br/api/qonws/swagger-resources/configuration/security'
          )
          i=0
          for url in "${urls[@]}"; do
            i=$((i+1))
            body="$OUT/body_${i}.txt"
            hdr="$OUT/hdr_${i}.txt"
            code="$(curl -4 -sS -L --connect-timeout 10 --max-time 30 -D "$hdr" -o "$body" -w '%{http_code}' "$url" || true)"
            ctype="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{v=$0} END{sub(/^[^:]+:[[:space:]]*/, "", v); gsub(/\r/,"",v); print v}' "$hdr" || true)"
            bytes="$(stat -c%s "$body" 2>/dev/null || echo 0)"
            printf '%s\t%s\t%s\t%s\n' "$url" "$code" "$ctype" "$bytes" >> "$OUT/probe.tsv"
          done
          cat "$OUT/probe.tsv"
          for f in "$OUT"/body_*.txt; do echo "=== $f ==="; head -c 4000 "$f"; echo; done

      - name: Persist discovery
        shell: bash
        run: |
          set -euo pipefail
          DEST=docs/data_sources/licitacon_qonws_discovery
          mkdir -p "$DEST"
          cp artifacts/licitacon_qonws_discovery/probe.tsv "$DEST/"
          for f in artifacts/licitacon_qonws_discovery/body_*.txt; do
            b="$(basename "$f")"
            if grep -Eiq 'swagger|openapi|licitacon|/api/' "$f"; then cp "$f" "$DEST/$b"; fi
          done
          cat > "$DEST/README.md" <<'EOF'
          # LicitaCon — descoberta de serviços públicos QONWS

          Fonte oficial: TCE-RS. A página de Sistemas de Controle Externo informa que há serviços de apoio ao LicitaCon, incluindo consultas de Órgãos, Licitações e Contratos, e aponta a documentação Swagger em `portal.tce.rs.gov.br/api/qonws/swagger-ui/index.html#/licitacon`.

          Esta auditoria verifica apenas acessibilidade pública e documentação do serviço. Nenhuma credencial é usada ou persistida.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m "data: discover LicitaCon QONWS public services"
            git pull --rebase origin explore/receita-estadual-rs-market-intel-v1
            git push origin HEAD:explore/receita-estadual-rs-market-intel-v1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: licitacon-qonws-discovery
          path: artifacts/licitacon_qonws_discovery/
