name: receita-dfe-powerbi-schema-discovery-v1

on:
  push:
    branches:
      - feature/cnpj-territorial-control-v1
    paths:
      - ".github/workflows/receita-dfe-powerbi-schema-discovery-v1.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/receita-dfe-powerbi-schema-discovery-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright beautifulsoup4 requests
          python -m playwright install --with-deps chromium >/dev/null

      - name: Inspect Receita Dados DFe public PowerBI models
        run: |
          set -euo pipefail
          mkdir -p artifacts/receita_dfe_powerbi_schema
          cat > /tmp/discover.py <<'PY'
          from __future__ import annotations

          import asyncio
          import json
          import re
          from pathlib import Path
          from urllib.parse import urljoin, urlsplit, urlunsplit

          import requests
          from bs4 import BeautifulSoup
          from playwright.async_api import async_playwright

          OUT=Path("artifacts/receita_dfe_powerbi_schema")
          PAGE="https://receitadados.sefaz.rs.gov.br/paineis/documentos-eletronicos/"
          LABELS=[
              "NFCe",
              "Quantidade",
              "Valor",
              "Impacto BR Covid",
              "Quantidade - Região",
              "Valor - Região",
              "Quantidade - Setor",
              "Valor - Setor",
              "Quantidade - Município",
              "Valor - Município",
          ]

          def redact(s: str) -> str:
              if not s:
                  return s
              s=re.sub(r'Bearer\s+[A-Za-z0-9._~+/=-]+','Bearer <REDACTED>',s,flags=re.I)
              s=re.sub(r'("?(?:accessToken|token|embedToken)"?\s*[:=]\s*")[^"]+(")',r'\1<REDACTED>\2',s,flags=re.I)
              return s

          def safe_url(url: str) -> str:
              # Persist public report URLs but remove query strings from network endpoints.
              p=urlsplit(url)
              if "app.powerbi.com/view" in url:
                  return url
              return urlunsplit((p.scheme,p.netloc,p.path,"",""))

          html=requests.get(PAGE,timeout=60,headers={"User-Agent":"SBMI DFe PowerBI schema audit/1.0"}).text
          (OUT/"page.html").write_text(html,encoding="utf-8")
          soup=BeautifulSoup(html,"html.parser")
          iframes=[urljoin(PAGE,x.get("src")) for x in soup.find_all("iframe") if x.get("src") and "app.powerbi.com" in x.get("src")]
          iframe_rows=[]
          for i,u in enumerate(iframes):
              iframe_rows.append({
                  "index":i,
                  "label_by_page_order":LABELS[i] if i < len(LABELS) else None,
                  "url":u,
              })

          # The last four report positions correspond to Setor/Município on the page.
          targets=[r for r in iframe_rows if r["index"] in (6,7,8,9)]
          if len(targets)<4:
              targets=iframe_rows[-4:]

          async def inspect_one(browser,row):
              records=[]
              page=await browser.new_page(viewport={"width":1600,"height":1000})

              async def response_handler(resp):
                  low=resp.url.lower()
                  if not any(k in low for k in ("modelsandexploration","querydata","metadata","explore","conceptualschema")):
                      return
                  rec={
                      "url":safe_url(resp.url),
                      "status":resp.status,
                      "content_type":resp.headers.get("content-type"),
                  }
                  try:
                      req=resp.request
                      if req.post_data:
                          rec["request_post_data_head"]=redact(req.post_data[:120000])
                  except Exception as exc:
                      rec["request_error"]=repr(exc)
                  try:
                      body=await resp.text()
                      rec["response_body_head"]=redact(body[:500000])
                      rec["response_body_len"]=len(body)
                      terms={}
                      for term in ("municipio","município","cnae","classe","ncm","modelo_dfe","nfce","nfc-e","valor","setor"):
                          terms[term]=len(re.findall(re.escape(term),body,flags=re.I))
                      rec["term_counts"]=terms
                  except Exception as exc:
                      rec["response_error"]=repr(exc)
                  records.append(rec)

              page.on("response",response_handler)
              err=None
              body_text=""
              try:
                  await page.goto(row["url"],wait_until="domcontentloaded",timeout=120000)
                  await page.wait_for_timeout(18000)
                  body_text=await page.locator("body").inner_text(timeout=10000)
              except Exception as exc:
                  err=repr(exc)
              finally:
                  await page.close()

              # Extract candidate field/model identifiers from captured JSON/text without persisting auth headers.
              combined="\n".join((r.get("response_body_head") or "") for r in records)
              field_snippets=[]
              for pat in [
                  r'.{0,180}(?:municipio|município).{0,300}',
                  r'.{0,180}cnae.{0,300}',
                  r'.{0,180}ncm.{0,300}',
                  r'.{0,180}(?:datasetId|modelId|resolvedCluster).{0,300}',
              ]:
                  for m in re.finditer(pat,combined,flags=re.I|re.S):
                      snip=redact(re.sub(r'\s+',' ',m.group(0)))
                      if snip not in field_snippets:
                          field_snippets.append(snip[:700])
                      if len(field_snippets)>=100:
                          break
                  if len(field_snippets)>=100:
                      break

              return {
                  **row,
                  "error":err,
                  "body_text_head":redact(body_text[:50000]),
                  "network_records":records,
                  "field_snippets":field_snippets,
              }

          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True)
                  results=[]
                  for row in targets:
                      print("INSPECT",row["index"],row["label_by_page_order"])
                      results.append(await inspect_one(browser,row))
                  await browser.close()

              summary=[]
              for r in results:
                  agg={"municipio":0,"cnae":0,"ncm":0,"querydata":0,"models":0}
                  for rec in r["network_records"]:
                      tc=rec.get("term_counts") or {}
                      agg["municipio"]+=tc.get("municipio",0)+tc.get("município",0)
                      agg["cnae"]+=tc.get("cnae",0)
                      agg["ncm"]+=tc.get("ncm",0)
                      if "querydata" in rec["url"].lower(): agg["querydata"]+=1
                      if "modelsandexploration" in rec["url"].lower(): agg["models"]+=1
                  summary.append({
                      "index":r["index"],
                      "label":r["label_by_page_order"],
                      "url":r["url"],
                      "network_count":len(r["network_records"]),
                      **agg,
                      "snippet_count":len(r["field_snippets"]),
                      "body_text_head":r["body_text_head"][:2500],
                  })

              out={
                  "source_page":PAGE,
                  "iframe_count":len(iframes),
                  "iframes":iframe_rows,
                  "targets":results,
                  "summary":summary,
                  "privacy":"No request/response headers or cookies are persisted. Token-like strings are redacted. Public embed URLs are preserved because they are already published on the official page.",
              }
              (OUT/"discovery.json").write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
              print("SBMI_DFE_POWERBI_SUMMARY_BEGIN")
              print(json.dumps({"iframes":iframe_rows,"summary":summary,
                                "snippets":[{"label":r["label_by_page_order"],"snippets":r["field_snippets"][:25]} for r in results]},
                               ensure_ascii=False,indent=2))
              print("SBMI_DFE_POWERBI_SUMMARY_END")

          asyncio.run(main())
          PY
          python /tmp/discover.py

      - name: Upload DFe PowerBI schema discovery
        uses: actions/upload-artifact@v4
        with:
          name: receita-dfe-powerbi-schema-discovery-v1
          path: artifacts/receita_dfe_powerbi_schema/
          if-no-files-found: error
          retention-days: 30
