name: consumer-income-sidra

on:
  pull_request:
    paths:
      - ".github/workflows/consumer-income-sidra.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-income:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch official SIDRA 10295 values for Sao Borja
        run: |
          python -m pip install --upgrade requests
          mkdir -p artifacts/raw_official
          python - <<'PY'
          import csv
          import hashlib
          import json
          from pathlib import Path

          import requests

          base = "https://apisidra.ibge.gov.br/values/t/10295"
          candidates = [
              base + "/n6/4318002/v/13431,13534/p/2022/h/y/f/a/d/m",
              base + "/n6/4318002/v/13431,13534/p/2022/c2/0/c86/0/c58/0/h/y/f/a/d/m",
          ]

          session = requests.Session()
          session.headers.update({
              "User-Agent": "SBMI territorial-market-intelligence source extraction/1.0"
          })

          manifest = {
              "nature": "observed_official_sidra_income_extraction",
              "source": "IBGE/SIDRA tabela 10295",
              "geography": "Sao Borja/RS",
              "municipality_ibge": "4318002",
              "period": "2022",
              "variables_requested": ["13431", "13534"],
              "attempts": [],
          }
          selected = None
          selected_rows = None
          selected_bytes = None

          for idx, url in enumerate(candidates, start=1):
              attempt = {"url": url}
              try:
                  response = session.get(url, timeout=60)
                  attempt["http_status"] = response.status_code
                  attempt["content_type"] = response.headers.get("content-type")
                  attempt["response_bytes"] = len(response.content)
                  attempt["sha256"] = hashlib.sha256(response.content).hexdigest()
                  raw_path = Path("artifacts/raw_official") / f"sidra_10295_attempt_{idx}.json"
                  raw_path.write_bytes(response.content)
                  attempt["raw_file"] = str(raw_path)
                  response.raise_for_status()
                  payload = response.json()
                  attempt["json_rows"] = len(payload)
                  if not isinstance(payload, list) or len(payload) < 2:
                      attempt["status"] = "invalid_payload"
                      manifest["attempts"].append(attempt)
                      continue
                  header = payload[0]
                  rows = payload[1:]
                  parsed = []
                  for row in rows:
                      parsed.append({
                          "municipality_code": row.get("D1C", ""),
                          "municipality_name": row.get("D1N", ""),
                          "variable_code": row.get("D2C", ""),
                          "variable_name": row.get("D2N", ""),
                          "period_code": row.get("D3C", ""),
                          "period_name": row.get("D3N", ""),
                          "unit_code": row.get("MC", ""),
                          "unit_name": row.get("MN", ""),
                          "value_raw": row.get("V", ""),
                          "header": header,
                          "raw_row": row,
                      })
                  vars_found = {item["variable_code"] for item in parsed}
                  municipality_ok = any(
                      item["municipality_code"] == "4318002" or "BORJA" in item["municipality_name"].upper()
                      for item in parsed
                  )
                  if {"13431", "13534"}.issubset(vars_found) and municipality_ok:
                      attempt["status"] = "selected"
                      manifest["attempts"].append(attempt)
                      selected = url
                      selected_rows = parsed
                      selected_bytes = response.content
                      break
                  attempt["status"] = "missing_expected_variables_or_municipality"
                  attempt["variables_found"] = sorted(vars_found)
              except (requests.RequestException, ValueError) as exc:
                  attempt["status"] = "request_or_parse_error"
                  attempt["error_type"] = type(exc).__name__
                  attempt["error"] = str(exc)
              manifest["attempts"].append(attempt)

          if selected_rows is None:
              Path("artifacts/sidra_10295_manifest.json").write_text(
                  json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8"
              )
              raise SystemExit("Could not recover expected Sao Borja income variables from SIDRA 10295")

          clean = []
          for item in selected_rows:
              if item["variable_code"] not in {"13431", "13534"}:
                  continue
              clean.append({
                  "municipio_codigo": item["municipality_code"],
                  "municipio": item["municipality_name"],
                  "periodo_codigo": item["period_code"],
                  "periodo": item["period_name"],
                  "variavel_codigo": item["variable_code"],
                  "variavel": item["variable_name"],
                  "unidade_codigo": item["unit_code"],
                  "unidade": item["unit_name"],
                  "valor_raw": item["value_raw"],
                  "natureza": "observado_em_fonte_oficial",
                  "source_url": selected,
                  "raw_sha256": hashlib.sha256(selected_bytes).hexdigest(),
              })

          clean.sort(key=lambda row: row["variavel_codigo"])
          csv_path = Path("artifacts/sidra_10295_sao_borja_income_2022.csv")
          with csv_path.open("w", encoding="utf-8", newline="") as handle:
              writer = csv.DictWriter(handle, fieldnames=list(clean[0]))
              writer.writeheader()
              writer.writerows(clean)

          manifest["selected_url"] = selected
          manifest["selected_sha256"] = hashlib.sha256(selected_bytes).hexdigest()
          manifest["rows"] = clean
          manifest["status"] = "success"
          manifest_path = Path("artifacts/sidra_10295_manifest.json")
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8"
          )

          print(manifest_path.read_text(encoding="utf-8"))
          print(csv_path.read_text(encoding="utf-8"))
          PY
      - name: Upload SIDRA income artifact
        uses: actions/upload-artifact@v4
        with:
          name: sidra-10295-sao-borja-income-2022
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/sidra_10295_sao_borja_income_2022.csv
            artifacts/sidra_10295_manifest.json
            artifacts/raw_official/
