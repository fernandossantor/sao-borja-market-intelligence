name: quality

on:
  pull_request:
  push:
    branches:
      - stabilization/architecture-v1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Lint stabilized package
        run: python -m ruff check src/sbmi tests

      - name: Test
        run: python -m pytest
