name: rs-powerbi-config-discovery

on:
  push:
    branches:
      - feature/cnpj-territorial-control-v1
    paths:
      - ".github/workflows/rs-powerbi-config-discovery.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/rs-powerbi-config-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Request public embed configuration and persist only non-secret metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import requests

          outdir=Path("artifacts/rs_powerbi_config"); outdir.mkdir(parents=True,exist_ok=True)
          url="https://www.transparencia.rs.gov.br/umbraco/Surface/PowerBI/Report"
          payload={
            "workspaceId":"48138f86-653d-4a67-98d5-4cf00cdbcf4a",
            "reportId":"f465474e-63b4-4b54-a8b8-65b32779e61f",
          }
          r=requests.post(url,data=payload,timeout=60,headers={"User-Agent":"Mozilla/5.0 SBMI audit"})
          r.raise_for_status()
          js=r.json()

          sensitive=("token","accesstoken","embedtoken")
          def scrub(x):
              if isinstance(x,dict):
                  out={}
                  for k,v in x.items():
                      if any(t in k.lower() for t in sensitive):
                          out[k]="<REDACTED>" if v else v
                      else:
                          out[k]=scrub(v)
                  return out
              if isinstance(x,list): return [scrub(v) for v in x]
              return x
          clean=scrub(js)
          clean["_http_status"]=r.status_code
          clean["_endpoint"]=url
          clean["_note"]="Any embed/access token returned by the public portal backend was redacted before artifact creation."
          (outdir/"config_redacted.json").write_text(json.dumps(clean,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(clean,ensure_ascii=False,indent=2)[:50000])
          PY

      - name: Upload redacted config
        uses: actions/upload-artifact@v4
        with:
          name: rs-powerbi-config-discovery
          retention-days: 30
          if-no-files-found: error
          path: artifacts/rs_powerbi_config/
